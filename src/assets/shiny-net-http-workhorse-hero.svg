<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="barFill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="60%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.3" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="220" cy="200" r="200" fill="#06b6d4" opacity="0.05" filter="url(#softGlow)"/>
  <circle cx="1000" cy="420" r="230" fill="#8b5cf6" opacity="0.06" filter="url(#softGlow)"/>
  <rect x="0" y="0" width="1200" height="3" fill="url(#accent)"/>

  <!-- Since 2016 chip -->
  <g transform="translate(80, 70)">
    <rect width="190" height="34" rx="17" fill="#1e1b4b" stroke="#34d399" stroke-width="1.5"/>
    <circle cx="22" cy="17" r="5" fill="#34d399" filter="url(#glow)"/>
    <text x="104" y="23" text-anchor="middle" fill="#a7f3d0" font-family="monospace" font-size="14" font-weight="bold">since 2016</text>
  </g>

  <!-- Headline -->
  <text x="80" y="185" fill="url(#title)" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="68" font-weight="800">Shiny.Net.Http</text>
  <text x="80" y="245" fill="#cbd5e1" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="34" font-weight="600">The mobile library workhorse</text>
  <text x="80" y="288" fill="#cbd5e1" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="34" font-weight="600">you didn't know you needed</text>

  <!-- Platform pills -->
  <g font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">
    <g transform="translate(80, 330)">
      <rect width="66" height="28" rx="14" fill="#0f172a" stroke="#22d3ee"/><text x="33" y="19" fill="#67e8f9">iOS</text>
    </g>
    <g transform="translate(156, 330)">
      <rect width="92" height="28" rx="14" fill="#0f172a" stroke="#34d399"/><text x="46" y="19" fill="#6ee7b7">Android</text>
    </g>
    <g transform="translate(258, 330)">
      <rect width="92" height="28" rx="14" fill="#0f172a" stroke="#8b5cf6"/><text x="46" y="19" fill="#c4b5fd">Windows</text>
    </g>
    <g transform="translate(360, 330)">
      <rect width="78" height="28" rx="14" fill="#0f172a" stroke="#22d3ee"/><text x="39" y="19" fill="#67e8f9">Linux</text>
    </g>
    <g transform="translate(448, 330)">
      <rect width="78" height="28" rx="14" fill="#0f172a" stroke="#34d399"/><text x="39" y="19" fill="#6ee7b7">macOS</text>
    </g>
    <g transform="translate(536, 330)">
      <rect width="82" height="28" rx="14" fill="#0f172a" stroke="#8b5cf6"/><text x="41" y="19" fill="#c4b5fd">Blazor</text>
    </g>
  </g>

  <!-- Transfer queue card -->
  <g transform="translate(80, 395)">
    <rect width="560" height="180" rx="16" fill="#0f172a" fill-opacity="0.75" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="34" fill="#94a3b8" font-family="monospace" font-size="13">HttpTransferMonitor.Transfers</text>

    <g font-family="monospace" font-size="14">
      <text x="24" y="70" fill="#e2e8f0">↑ inspection-photos.zip</text>
      <text x="536" y="70" text-anchor="end" fill="#67e8f9">72% · 4.1 MB/s · 0:09</text>
      <rect x="24" y="80" width="512" height="8" rx="4" fill="#1e293b"/>
      <rect x="24" y="80" width="369" height="8" rx="4" fill="url(#barFill)" filter="url(#glow)"/>

      <text x="24" y="118" fill="#e2e8f0">↓ offline-model.bin</text>
      <text x="536" y="118" text-anchor="end" fill="#67e8f9">38% · 9.6 MB/s · 0:41</text>
      <rect x="24" y="128" width="512" height="8" rx="4" fill="#1e293b"/>
      <rect x="24" y="128" width="195" height="8" rx="4" fill="url(#barFill)" filter="url(#glow)"/>

      <text x="24" y="164" fill="#e2e8f0">↑ device-logs.txt</text>
      <text x="536" y="164" text-anchor="end" fill="#fbbf24">PausedByNoNetwork</text>
    </g>
  </g>

  <!-- Phone with lock screen progress -->
  <g transform="translate(800, 95)">
    <rect x="0" y="0" width="250" height="450" rx="32" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect x="14" y="16" width="222" height="418" rx="20" fill="#020617" stroke="#334155"/>
    <!-- island -->
    <g transform="translate(72, 30)">
      <rect width="106" height="28" rx="14" fill="#000" stroke="#22d3ee" stroke-width="1"/>
      <circle cx="20" cy="14" r="6" fill="none" stroke="#22d3ee" stroke-width="2"/>
      <path d="M20 8 A6 6 0 1 1 14.3 16" fill="none" stroke="#34d399" stroke-width="2"/>
      <text x="66" y="19" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="12" font-weight="bold">61%</text>
    </g>
    <text x="125" y="130" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="56" font-weight="300">9:41</text>
    <text x="125" y="158" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">Monday, October 19</text>

    <!-- live activity -->
    <g transform="translate(26, 300)">
      <rect width="198" height="100" rx="16" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1"/>
      <text x="16" y="28" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Uploading 3 files</text>
      <text x="16" y="48" fill="#94a3b8" font-family="monospace" font-size="11">5.2 MB/s · 0:24 left</text>
      <rect x="16" y="64" width="166" height="8" rx="4" fill="#1e293b"/>
      <rect x="16" y="64" width="101" height="8" rx="4" fill="url(#barFill)" filter="url(#glow)"/>
      <text x="182" y="90" text-anchor="end" fill="#67e8f9" font-family="monospace" font-size="11">61%</text>
    </g>
    <!-- suspended chip -->
    <g transform="translate(45, 222)">
      <rect width="160" height="28" rx="14" fill="#0f172a" stroke="#f472b6"/>
      <circle cx="18" cy="14" r="4" fill="#f472b6"/>
      <text x="88" y="19" text-anchor="middle" fill="#fbcfe8" font-family="monospace" font-size="12" font-weight="bold">app suspended</text>
    </g>
  </g>
</svg>

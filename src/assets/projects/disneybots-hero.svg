<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Disney Droids">
	<defs>
		<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#0b1020"/>
			<stop offset="50%" stop-color="#161c3d"/>
			<stop offset="100%" stop-color="#0b1020"/>
		</linearGradient>
		<radialGradient id="halo" cx="50%" cy="42%" r="62%">
			<stop offset="0%" stop-color="#22d3ee" stop-opacity="0.30"/>
			<stop offset="60%" stop-color="#22d3ee" stop-opacity="0.07"/>
			<stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
		</radialGradient>
		<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
			<path d="M40 0H0v40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
		</pattern>
		<filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
			<feGaussianBlur stdDeviation="7" result="b"/>
			<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
		</filter>
	</defs>

	<rect width="1200" height="630" fill="url(#bg)"/>
	<rect width="1200" height="630" fill="url(#grid)"/>
	<rect width="1200" height="630" fill="url(#halo)"/>
	<rect x="0" y="0" width="1200" height="6" fill="#22d3ee" opacity="0.85"/>

	<path d="M520 230a80 80 0 0 1 160 0Z" fill="#0d1428" stroke="#22d3ee" stroke-width="5" filter="url(#glow)"/>
	<circle cx="600" cy="195" r="14" fill="#22d3ee"/>
	<rect x="520" y="238" width="160" height="130" rx="10" fill="#0d1428" stroke="#22d3ee" stroke-width="5"/>
	<rect x="548" y="262" width="104" height="18" rx="4" fill="#22d3ee" opacity="0.6"/>
	<rect x="548" y="294" width="46" height="46" rx="6" fill="none" stroke="#22d3ee" stroke-width="3" opacity="0.8"/>
	<rect x="606" y="294" width="46" height="18" rx="4" fill="#22d3ee" opacity="0.35"/>
	<rect x="606" y="322" width="46" height="18" rx="4" fill="#22d3ee" opacity="0.35"/>
	<path d="M500 250l-24 130h40l8-40" fill="none" stroke="#22d3ee" stroke-width="5" stroke-linejoin="round"/>
	<path d="M700 250l24 130h-40l-8-40" fill="none" stroke="#22d3ee" stroke-width="5" stroke-linejoin="round"/>
	<path d="M760 170a60 60 0 0 1 0 90" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
	<path d="M790 145a95 95 0 0 1 0 140" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
	<path d="M820 120a130 130 0 0 1 0 190" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" opacity="0.25"/>

	<text x="600" y="506" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="66" font-weight="700" fill="#f8fafc" letter-spacing="-1.5">Disney Droids</text>
	<text x="600" y="556" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="500" fill="#22d3ee" opacity="0.95">Droid Depot droids over Bluetooth LE</text>
	<text x="600" y="598" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="19" fill="#94a3b8" opacity="0.75">GoneDotNet/disneybots</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="BluetoothLE Hubs">
	<defs>
		<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#0b1020"/>
			<stop offset="50%" stop-color="#161c3d"/>
			<stop offset="100%" stop-color="#0b1020"/>
		</linearGradient>
		<radialGradient id="halo" cx="50%" cy="38%" r="62%">
			<stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.30"/>
			<stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.07"/>
			<stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
		</radialGradient>
		<linearGradient id="link" x1="0%" y1="0%" x2="100%" y2="0%">
			<stop offset="0%" stop-color="#22d3ee"/>
			<stop offset="100%" stop-color="#a78bfa"/>
		</linearGradient>
		<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
			<path d="M40 0H0v40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
		</pattern>
		<filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
			<feGaussianBlur stdDeviation="7" result="b"/>
			<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
		</filter>
	</defs>

	<rect width="1200" height="630" fill="url(#bg)"/>
	<rect width="1200" height="630" fill="url(#grid)"/>
	<rect width="1200" height="630" fill="url(#halo)"/>
	<rect x="0" y="0" width="1200" height="6" fill="#8b5cf6" opacity="0.85"/>

	<!-- radio rings around the hub -->
	<circle cx="600" cy="250" r="110" fill="none" stroke="#a78bfa" stroke-opacity="0.22" stroke-width="2"/>
	<circle cx="600" cy="250" r="160" fill="none" stroke="#a78bfa" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="6 10"/>

	<!-- links to clients -->
	<g stroke="url(#link)" stroke-width="3" stroke-linecap="round" opacity="0.8">
		<line x1="600" y1="250" x2="360" y2="150"/>
		<line x1="600" y1="250" x2="360" y2="350"/>
		<line x1="600" y1="250" x2="840" y2="150"/>
		<line x1="600" y1="250" x2="840" y2="350"/>
	</g>

	<!-- message packets in flight -->
	<g fill="#22d3ee" filter="url(#glow)">
		<circle cx="470" cy="196" r="6"/>
		<circle cx="730" cy="304" r="6"/>
	</g>
	<g fill="#34d399" filter="url(#glow)">
		<circle cx="500" cy="292" r="6"/>
		<circle cx="710" cy="204" r="6"/>
	</g>

	<!-- client devices -->
	<g fill="#0d1428" stroke="#22d3ee" stroke-width="3">
		<rect x="330" y="112" width="60" height="76" rx="12"/>
		<rect x="330" y="312" width="60" height="76" rx="12"/>
		<rect x="810" y="112" width="60" height="76" rx="12"/>
		<rect x="810" y="312" width="60" height="76" rx="12"/>
	</g>

	<!-- hub with bluetooth rune -->
	<circle cx="600" cy="250" r="58" fill="#0d1428" stroke="#a78bfa" stroke-width="5" filter="url(#glow)"/>
	<path d="M584 228l32 32-16 16v-56l16 16-32 32" fill="none" stroke="#f8fafc" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

	<text x="600" y="506" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="66" font-weight="700" fill="#f8fafc" letter-spacing="-1.5">BluetoothLE Hubs</text>
	<text x="600" y="556" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="500" fill="#a78bfa" opacity="0.95">SignalR-style hubs over Bluetooth LE</text>
	<text x="600" y="598" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="19" fill="#94a3b8" opacity="0.75">shinyorg/blehubs</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="ShinyCommander">
	<defs>
		<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#0b1020"/>
			<stop offset="50%" stop-color="#1c1a33"/>
			<stop offset="100%" stop-color="#0b1020"/>
		</linearGradient>
		<radialGradient id="halo" cx="50%" cy="40%" r="62%">
			<stop offset="0%" stop-color="#fbbf24" stop-opacity="0.24"/>
			<stop offset="60%" stop-color="#fbbf24" stop-opacity="0.06"/>
			<stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
		</radialGradient>
		<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
			<path d="M40 0H0v40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
		</pattern>
		<filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
			<feGaussianBlur stdDeviation="7" result="b"/>
			<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
		</filter>
	</defs>

	<rect width="1200" height="630" fill="url(#bg)"/>
	<rect width="1200" height="630" fill="url(#grid)"/>
	<rect width="1200" height="630" fill="url(#halo)"/>
	<rect x="0" y="0" width="1200" height="6" fill="#fbbf24" opacity="0.85"/>

	<!-- window -->
	<rect x="250" y="70" width="700" height="350" rx="16" fill="#0d1428" stroke="#fbbf24" stroke-opacity="0.55" stroke-width="2" filter="url(#glow)"/>
	<circle cx="276" cy="94" r="6" fill="#f87171" opacity="0.8"/>
	<circle cx="296" cy="94" r="6" fill="#fbbf24" opacity="0.8"/>
	<circle cx="316" cy="94" r="6" fill="#4ade80" opacity="0.8"/>

	<!-- left pane (active) -->
	<path d="M270 128 h70 a6 6 0 0 1 6 6 v10 h-82 v-10 a6 6 0 0 1 6 -6 Z" fill="#fbbf24" opacity="0.85"/>
	<path d="M352 128 h62 a6 6 0 0 1 6 6 v10 h-74 v-10 a6 6 0 0 1 6 -6 Z" fill="#111a33" stroke="#fbbf24" stroke-opacity="0.35"/>
	<rect x="264" y="144" width="330" height="236" rx="8" fill="#111a33" stroke="#fbbf24" stroke-opacity="0.7" stroke-width="1.5"/>
	<rect x="280" y="156" width="140" height="8" rx="4" fill="#fbbf24" opacity="0.45"/>
	<line x1="264" y1="174" x2="594" y2="174" stroke="#fbbf24" stroke-opacity="0.2"/>
	<g fill="#fbbf24">
		<rect x="280" y="188" width="14" height="11" rx="2" opacity="0.6"/><rect x="304" y="190" width="120" height="7" rx="3.5" opacity="0.35"/><rect x="530" y="190" width="48" height="7" rx="3.5" opacity="0.2"/>
		<rect x="280" y="214" width="14" height="11" rx="2" opacity="0.6"/><rect x="304" y="216" width="90" height="7" rx="3.5" opacity="0.35"/><rect x="530" y="216" width="48" height="7" rx="3.5" opacity="0.2"/>
	</g>
	<!-- cursor row -->
	<rect x="270" y="234" width="318" height="24" rx="5" fill="#fbbf24" opacity="0.22" stroke="#fbbf24" stroke-opacity="0.8"/>
	<rect x="280" y="240" width="14" height="11" rx="2" fill="#fbbf24" opacity="0.95"/><rect x="304" y="242" width="140" height="7" rx="3.5" fill="#fef3c7" opacity="0.85"/><rect x="530" y="242" width="48" height="7" rx="3.5" fill="#fef3c7" opacity="0.5"/>
	<!-- marked rows -->
	<g>
		<rect x="280" y="266" width="12" height="13" rx="2" fill="#f87171" opacity="0.75"/><rect x="304" y="269" width="110" height="7" rx="3.5" fill="#f87171" opacity="0.7"/><rect x="530" y="269" width="48" height="7" rx="3.5" fill="#f87171" opacity="0.4"/>
		<rect x="280" y="292" width="12" height="13" rx="2" fill="#f87171" opacity="0.75"/><rect x="304" y="295" width="150" height="7" rx="3.5" fill="#f87171" opacity="0.7"/><rect x="530" y="295" width="48" height="7" rx="3.5" fill="#f87171" opacity="0.4"/>
	</g>
	<g fill="#fbbf24">
		<rect x="280" y="318" width="12" height="13" rx="2" opacity="0.3"/><rect x="304" y="321" width="100" height="7" rx="3.5" opacity="0.25"/><rect x="530" y="321" width="48" height="7" rx="3.5" opacity="0.15"/>
		<rect x="280" y="344" width="12" height="13" rx="2" opacity="0.3"/><rect x="304" y="347" width="130" height="7" rx="3.5" opacity="0.25"/><rect x="530" y="347" width="48" height="7" rx="3.5" opacity="0.15"/>
	</g>

	<!-- right pane -->
	<path d="M612 128 h62 a6 6 0 0 1 6 6 v10 h-74 v-10 a6 6 0 0 1 6 -6 Z" fill="#111a33" stroke="#fbbf24" stroke-opacity="0.45"/>
	<rect x="606" y="144" width="330" height="236" rx="8" fill="#111a33" stroke="#fbbf24" stroke-opacity="0.3"/>
	<rect x="622" y="156" width="110" height="8" rx="4" fill="#fbbf24" opacity="0.3"/>
	<line x1="606" y1="174" x2="936" y2="174" stroke="#fbbf24" stroke-opacity="0.15"/>
	<g fill="#fbbf24">
		<rect x="622" y="188" width="14" height="11" rx="2" opacity="0.4"/><rect x="646" y="190" width="100" height="7" rx="3.5" opacity="0.25"/><rect x="872" y="190" width="48" height="7" rx="3.5" opacity="0.15"/>
		<rect x="622" y="214" width="12" height="13" rx="2" opacity="0.3"/><rect x="646" y="216" width="130" height="7" rx="3.5" opacity="0.25"/><rect x="872" y="216" width="48" height="7" rx="3.5" opacity="0.15"/>
		<rect x="622" y="240" width="12" height="13" rx="2" opacity="0.3"/><rect x="646" y="242" width="80" height="7" rx="3.5" opacity="0.25"/><rect x="872" y="242" width="48" height="7" rx="3.5" opacity="0.15"/>
	</g>
	<!-- copy arrow between panes -->
	<path d="M560 282 C640 282 660 282 700 282" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5 6" opacity="0.6"/>
	<path d="M700 274 l12 8 l-12 8 Z" fill="#fbbf24" opacity="0.8"/>
	<rect x="646" y="304" width="274" height="8" rx="4" fill="#fbbf24" opacity="0.12"/>
	<rect x="646" y="304" width="170" height="8" rx="4" fill="#fbbf24" opacity="0.6"/>

	<!-- function key bar -->
	<g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#fbbf24" text-anchor="middle">
		<rect x="264" y="390" width="104" height="20" rx="5" fill="#111a33" stroke="#fbbf24" stroke-opacity="0.3"/><text x="316" y="404" opacity="0.8">F3 View</text>
		<rect x="376" y="390" width="104" height="20" rx="5" fill="#111a33" stroke="#fbbf24" stroke-opacity="0.3"/><text x="428" y="404" opacity="0.8">F4 Edit</text>
		<rect x="488" y="390" width="104" height="20" rx="5" fill="#111a33" stroke="#fbbf24" stroke-opacity="0.8"/><text x="540" y="404">F5 Copy</text>
		<rect x="600" y="390" width="104" height="20" rx="5" fill="#111a33" stroke="#fbbf24" stroke-opacity="0.3"/><text x="652" y="404" opacity="0.8">F6 Move</text>
		<rect x="712" y="390" width="104" height="20" rx="5" fill="#111a33" stroke="#fbbf24" stroke-opacity="0.3"/><text x="764" y="404" opacity="0.8">F7 MkDir</text>
		<rect x="824" y="390" width="112" height="20" rx="5" fill="#111a33" stroke="#fbbf24" stroke-opacity="0.3"/><text x="880" y="404" opacity="0.8">F8 Delete</text>
	</g>

	<text x="600" y="506" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="66" font-weight="700" fill="#f8fafc" letter-spacing="-1.5">ShinyCommander</text>
	<text x="600" y="556" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="500" fill="#fbbf24" opacity="0.95">A keyboard-first, dual-pane file manager</text>
	<text x="600" y="598" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="19" fill="#94a3b8" opacity="0.75">ShinySoftware/Commander</text>
</svg>

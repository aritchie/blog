<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Mediator Sample">
	<defs>
		<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#0b1020"/>
			<stop offset="50%" stop-color="#161c3d"/>
			<stop offset="100%" stop-color="#0b1020"/>
		</linearGradient>
		<radialGradient id="halo" cx="50%" cy="42%" r="62%">
			<stop offset="0%" stop-color="#a3e635" stop-opacity="0.30"/>
			<stop offset="60%" stop-color="#a3e635" stop-opacity="0.07"/>
			<stop offset="100%" stop-color="#a3e635" stop-opacity="0"/>
		</radialGradient>
		<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
			<path d="M40 0H0v40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
		</pattern>
		<filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
			<feGaussianBlur stdDeviation="7" result="b"/>
			<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
		</filter>
	</defs>

	<rect width="1200" height="630" fill="url(#bg)"/>
	<rect width="1200" height="630" fill="url(#grid)"/>
	<rect width="1200" height="630" fill="url(#halo)"/>
	<rect x="0" y="0" width="1200" height="6" fill="#a3e635" opacity="0.85"/>

	<g>
		<rect x="340" y="190" width="150" height="110" rx="14" fill="#111a33" stroke="#a3e635" stroke-opacity="0.4"/>
		<rect x="364" y="222" width="102" height="14" rx="7" fill="#a3e635" opacity="0.55"/>
		<rect x="364" y="248" width="66" height="14" rx="7" fill="#a3e635" opacity="0.3"/>
		<rect x="540" y="230" width="150" height="110" rx="14" fill="#111a33" stroke="#a3e635" stroke-opacity="0.55"/>
		<rect x="564" y="262" width="102" height="14" rx="7" fill="#a3e635" opacity="0.55"/>
		<rect x="564" y="288" width="66" height="14" rx="7" fill="#a3e635" opacity="0.3"/>
		<rect x="740" y="190" width="150" height="110" rx="14" fill="#111a33" stroke="#a3e635" stroke-opacity="0.7"/>
		<rect x="764" y="222" width="102" height="14" rx="7" fill="#a3e635" opacity="0.55"/>
		<rect x="764" y="248" width="66" height="14" rx="7" fill="#a3e635" opacity="0.3"/>
		<path d="M490 245h34l16 40h34" fill="none" stroke="#a3e635" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
		<path d="M690 285h34l16 -40h34" fill="none" stroke="#a3e635" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
		<circle cx="908" cy="325" r="10" fill="#a3e635"/>
	</g>

	<text x="600" y="506" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="66" font-weight="700" fill="#f8fafc" letter-spacing="-1.5">Mediator Sample</text>
	<text x="600" y="556" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="500" fill="#a3e635" opacity="0.95">Handlers, events, middleware</text>
	<text x="600" y="598" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="19" fill="#94a3b8" opacity="0.75">shinyorg/mediatorsample</text>
</svg>

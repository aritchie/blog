		<rect x="356" y="336" width="178" height="34" rx="8" fill="#f472b6" opacity="0.22999999999999998"/>
		<rect x="670" y="150" width="200" height="270" rx="26" fill="#0d1428" stroke="#f472b6" stroke-width="2"/>
		<rect x="742" y="164" width="56" height="8" rx="4" fill="#f472b6" opacity="0.6"/>
		<rect x="694" y="200 " width="152" height="46" rx="10" fill="#f472b6" opacity="0.42"/>
		<rect x="694" y="262 " width="152" height="46" rx="10" fill="#f472b6" opacity="0.31999999999999995"/>
		<rect x="694" y="324 " width="152" height="46" rx="10" fill="#f472b6" opacity="0.21999999999999997"/>

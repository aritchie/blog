	<text x="600" y="556" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="500" fill="#22d3ee" opacity="0.95">Bluetooth LE client and peripheral</text>

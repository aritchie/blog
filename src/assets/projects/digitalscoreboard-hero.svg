		<path d="M468 216a68 68 0 0 1 0 104" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
		<path d="M502 190a102 102 0 0 1 0 156" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" opacity="0.19999999999999996"/>

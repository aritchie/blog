		<path d="M698 190a102 102 0 0 0 0 156" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" opacity="0.19999999999999996"/>
		<circle cx="600" cy="268" r="34" fill="#0d1428" stroke="#22d3ee" stroke-width="3" filter="url(#glow)"/>
		<path d="M600 240v56l22-16-44-24 44-24-22-16" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Heads Up Clone">
	<defs>
		<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#0b1020"/>
			<stop offset="50%" stop-color="#161c3d"/>
			<stop offset="100%" stop-color="#0b1020"/>
		</linearGradient>
		<radialGradient id="halo" cx="50%" cy="42%" r="62%">
			<stop offset="0%" stop-color="#fb923c" stop-opacity="0.30"/>
			<stop offset="60%" stop-color="#fb923c" stop-opacity="0.07"/>
			<stop offset="100%" stop-color="#fb923c" stop-opacity="0"/>
		</radialGradient>
		<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
			<path d="M40 0H0v40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
		</pattern>
		<filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
			<feGaussianBlur stdDeviation="7" result="b"/>
			<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
		</filter>
	</defs>

	<rect width="1200" height="630" fill="url(#bg)"/>
	<rect width="1200" height="630" fill="url(#grid)"/>
	<rect width="1200" height="630" fill="url(#halo)"/>
	<rect x="0" y="0" width="1200" height="6" fill="#fb923c" opacity="0.85"/>

	<g>
		<g transform="rotate(-24 600 470)">
			<rect x="502" y="140" width="196" height="272" rx="18" fill="#111a33" stroke="#fb923c" stroke-opacity="0.35" stroke-width="2"/>
			<rect x="530" y="176" width="140" height="20" rx="10" fill="#fb923c" opacity="0.35"/>
			<rect x="530" y="212" width="96" height="20" rx="10" fill="#fb923c" opacity="0.21"/>
		</g>
		<g transform="rotate(-8 600 470)">
			<rect x="502" y="140" width="196" height="272" rx="18" fill="#111a33" stroke="#fb923c" stroke-opacity="0.53" stroke-width="2"/>
			<rect x="530" y="176" width="140" height="20" rx="10" fill="#fb923c" opacity="0.53"/>
			<rect x="530" y="212" width="96" height="20" rx="10" fill="#fb923c" opacity="0.318"/>
		</g>
		<g transform="rotate(8 600 470)">
			<rect x="502" y="140" width="196" height="272" rx="18" fill="#111a33" stroke="#fb923c" stroke-opacity="0.71" stroke-width="2"/>
			<rect x="530" y="176" width="140" height="20" rx="10" fill="#fb923c" opacity="0.71"/>
			<rect x="530" y="212" width="96" height="20" rx="10" fill="#fb923c" opacity="0.426"/>
		</g>
		<g transform="rotate(24 600 470)">
			<rect x="502" y="140" width="196" height="272" rx="18" fill="#111a33" stroke="#fb923c" stroke-opacity="0.89" stroke-width="2"/>
			<rect x="530" y="176" width="140" height="20" rx="10" fill="#fb923c" opacity="0.89"/>
			<rect x="530" y="212" width="96" height="20" rx="10" fill="#fb923c" opacity="0.534"/>
		</g>
		<circle cx="600" cy="252" r="30" fill="#fb923c" opacity="0.9" filter="url(#glow)"/>
	</g>

	<text x="600" y="506" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="66" font-weight="700" fill="#f8fafc" letter-spacing="-1.5">Heads Up Clone</text>
	<text x="600" y="556" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="500" fill="#fb923c" opacity="0.95">Accelerometer party game</text>
	<text x="600" y="598" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="19" fill="#94a3b8" opacity="0.75">gonedotnet/headsup</text>
</svg>

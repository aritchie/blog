<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="App Templates">
	<defs>
		<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#0b1020"/>
			<stop offset="50%" stop-color="#161c3d"/>
			<stop offset="100%" stop-color="#0b1020"/>
		</linearGradient>
		<radialGradient id="halo" cx="50%" cy="42%" r="62%">
			<stop offset="0%" stop-color="#818cf8" stop-opacity="0.30"/>
			<stop offset="60%" stop-color="#818cf8" stop-opacity="0.07"/>
			<stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
		</radialGradient>
		<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
			<path d="M40 0H0v40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
		</pattern>
		<filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
			<feGaussianBlur stdDeviation="7" result="b"/>
			<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
		</filter>
	</defs>

	<rect width="1200" height="630" fill="url(#bg)"/>
	<rect width="1200" height="630" fill="url(#grid)"/>
	<rect width="1200" height="630" fill="url(#halo)"/>
	<rect x="0" y="0" width="1200" height="6" fill="#818cf8" opacity="0.85"/>

	<g>
		<rect x="468" y="150" width="264" height="46" rx="10" fill="#111a33" stroke="#818cf8" stroke-opacity="0.25"/>
		<rect x="488" y="167" width="74" height="12" rx="6" fill="#818cf8" opacity="0.3"/>
		<rect x="422" y="212" width="356" height="46" rx="10" fill="#111a33" stroke="#818cf8" stroke-opacity="0.45"/>
		<rect x="442" y="229" width="89.33333333333333" height="12" rx="6" fill="#818cf8" opacity="0.48"/>
		<rect x="376" y="274" width="448" height="46" rx="10" fill="#111a33" stroke="#818cf8" stroke-opacity="0.65"/>
		<rect x="396" y="291" width="104.66666666666667" height="12" rx="6" fill="#818cf8" opacity="0.6599999999999999"/>
		<rect x="330" y="336" width="540" height="46" rx="10" fill="#111a33" stroke="#818cf8" stroke-opacity="0.8500000000000001"/>
		<rect x="350" y="353" width="120" height="12" rx="6" fill="#818cf8" opacity="0.8400000000000001"/>
	</g>

	<text x="600" y="506" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="66" font-weight="700" fill="#f8fafc" letter-spacing="-1.5">App Templates</text>
	<text x="600" y="556" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="500" fill="#818cf8" opacity="0.95">Scaffolding for Shiny-powered apps</text>
	<text x="600" y="598" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="19" fill="#94a3b8" opacity="0.75">shinyorg/templates</text>
</svg>

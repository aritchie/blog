<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="MAUI Platforms">
	<defs>
		<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#0b1020"/>
			<stop offset="50%" stop-color="#161c3d"/>
			<stop offset="100%" stop-color="#0b1020"/>
		</linearGradient>
		<radialGradient id="halo" cx="50%" cy="42%" r="62%">
			<stop offset="0%" stop-color="#a78bfa" stop-opacity="0.30"/>
			<stop offset="60%" stop-color="#a78bfa" stop-opacity="0.07"/>
			<stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
		</radialGradient>
		<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
			<path d="M40 0H0v40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
		</pattern>
		<filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
			<feGaussianBlur stdDeviation="7" result="b"/>
			<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
		</filter>
	</defs>

	<rect width="1200" height="630" fill="url(#bg)"/>
	<rect width="1200" height="630" fill="url(#grid)"/>
	<rect width="1200" height="630" fill="url(#halo)"/>
	<rect x="0" y="0" width="1200" height="6" fill="#a78bfa" opacity="0.85"/>

	<rect x="520" y="90" width="160" height="96" rx="16" fill="#0d1428" stroke="#a78bfa" stroke-width="4" filter="url(#glow)"/>
	<text x="600" y="150" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="700" fill="#f8fafc">MAUI</text>
	<path d="M600 186C600 240 420 240 420 290" fill="none" stroke="#a78bfa" stroke-opacity="0.55" stroke-width="3" stroke-dasharray="8 8"/>
	<rect x="330" y="290" width="180" height="92" rx="14" fill="#0d1428" stroke="#a78bfa" stroke-width="3"/>
	<circle cx="502" cy="298" r="12" fill="#a78bfa"/>
	<text x="420" y="344" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="22" fill="#e2e8f0">Web · WASM</text>
	<path d="M600 186C600 240 600 240 600 290" fill="none" stroke="#a78bfa" stroke-opacity="0.55" stroke-width="3" stroke-dasharray="8 8"/>
	<rect x="530" y="290" width="140" height="92" rx="14" fill="#0d1428" stroke="#a78bfa" stroke-width="3"/>
	<circle cx="662" cy="298" r="12" fill="#a78bfa"/>
	<text x="600" y="344" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="22" fill="#e2e8f0">tvOS</text>
	<path d="M600 186C600 240 790 240 790 290" fill="none" stroke="#94a3b8" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="4 10"/>
	<rect x="690" y="290" width="200" height="92" rx="14" fill="#0d1428" stroke="#94a3b8" stroke-opacity="0.45" stroke-width="3" stroke-dasharray="10 6"/>
	<text x="790" y="332" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="22" fill="#cbd5e1">macOS</text>
	<text x="790" y="362" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="16" fill="#a78bfa">→ maui-labs</text>

	<text x="600" y="506" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="66" font-weight="700" fill="#f8fafc" letter-spacing="-1.5">MAUI Platforms</text>
	<text x="600" y="556" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="500" fill="#a78bfa" opacity="0.95">MAUI for the Web and Apple TV</text>
	<text x="600" y="598" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="19" fill="#94a3b8" opacity="0.75">shinyorg/mauiplatforms</text>
</svg>

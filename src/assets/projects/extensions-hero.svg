<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="App Extensions">
	<defs>
		<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#0b1020"/>
			<stop offset="50%" stop-color="#161c3d"/>
			<stop offset="100%" stop-color="#0b1020"/>
		</linearGradient>
		<radialGradient id="halo" cx="50%" cy="42%" r="62%">
			<stop offset="0%" stop-color="#a78bfa" stop-opacity="0.30"/>
			<stop offset="60%" stop-color="#a78bfa" stop-opacity="0.07"/>
			<stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
		</radialGradient>
		<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
			<path d="M40 0H0v40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
		</pattern>
		<filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
			<feGaussianBlur stdDeviation="7" result="b"/>
			<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
		</filter>
	</defs>

	<rect width="1200" height="630" fill="url(#bg)"/>
	<rect width="1200" height="630" fill="url(#grid)"/>
	<rect width="1200" height="630" fill="url(#halo)"/>
	<rect x="0" y="0" width="1200" height="6" fill="#a78bfa" opacity="0.85"/>

	<g opacity="0.9">
		<line x1="600" y1="268" x2="300" y2="170" stroke="#a78bfa" stroke-width="1.5" opacity="0.35" stroke-dasharray="5 6"/>
		<line x1="600" y1="268" x2="300" y2="366" stroke="#a78bfa" stroke-width="1.5" opacity="0.35" stroke-dasharray="5 6"/>
		<line x1="600" y1="268" x2="500" y2="130" stroke="#a78bfa" stroke-width="1.5" opacity="0.35" stroke-dasharray="5 6"/>
		<line x1="600" y1="268" x2="700" y2="130" stroke="#a78bfa" stroke-width="1.5" opacity="0.35" stroke-dasharray="5 6"/>
		<line x1="600" y1="268" x2="900" y2="170" stroke="#a78bfa" stroke-width="1.5" opacity="0.35" stroke-dasharray="5 6"/>
		<line x1="600" y1="268" x2="900" y2="366" stroke="#a78bfa" stroke-width="1.5" opacity="0.35" stroke-dasharray="5 6"/>
		<line x1="600" y1="268" x2="500" y2="406" stroke="#a78bfa" stroke-width="1.5" opacity="0.35" stroke-dasharray="5 6"/>
		<line x1="600" y1="268" x2="700" y2="406" stroke="#a78bfa" stroke-width="1.5" opacity="0.35" stroke-dasharray="5 6"/>
	</g>
	<g>
		<rect x="254" y="146" width="92" height="48" rx="10" fill="#111a33" stroke="#a78bfa" stroke-opacity="0.5"/>
		<rect x="254" y="342" width="92" height="48" rx="10" fill="#111a33" stroke="#a78bfa" stroke-opacity="0.5"/>
		<rect x="454" y="106" width="92" height="48" rx="10" fill="#111a33" stroke="#a78bfa" stroke-opacity="0.5"/>
		<rect x="654" y="106" width="92" height="48" rx="10" fill="#111a33" stroke="#a78bfa" stroke-opacity="0.5"/>
		<rect x="854" y="146" width="92" height="48" rx="10" fill="#111a33" stroke="#a78bfa" stroke-opacity="0.5"/>
		<rect x="854" y="342" width="92" height="48" rx="10" fill="#111a33" stroke="#a78bfa" stroke-opacity="0.5"/>
		<rect x="454" y="382" width="92" height="48" rx="10" fill="#111a33" stroke="#a78bfa" stroke-opacity="0.5"/>
		<rect x="654" y="382" width="92" height="48" rx="10" fill="#111a33" stroke="#a78bfa" stroke-opacity="0.5"/>
	</g>
	<circle cx="600" cy="268" r="74" fill="#0d1428" stroke="#a78bfa" stroke-width="2" filter="url(#glow)"/>
	<circle cx="600" cy="268" r="30" fill="#a78bfa" opacity="0.9"/>

	<text x="600" y="506" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="66" font-weight="700" fill="#f8fafc" letter-spacing="-1.5">App Extensions</text>
	<text x="600" y="556" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="500" fill="#a78bfa" opacity="0.95">Source generators that delete boilerplate</text>
	<text x="600" y="598" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="19" fill="#94a3b8" opacity="0.75">shinyorg/extensions</text>
</svg>

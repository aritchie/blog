<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Shiny Actors">
	<defs>
		<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#0b1020"/>
			<stop offset="50%" stop-color="#131a3a"/>
			<stop offset="100%" stop-color="#0b1020"/>
		</linearGradient>
		<radialGradient id="halo" cx="50%" cy="38%" r="62%">
			<stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22"/>
			<stop offset="60%" stop-color="#f59e0b" stop-opacity="0.06"/>
			<stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
		</radialGradient>
		<linearGradient id="link" x1="0%" y1="0%" x2="100%" y2="0%">
			<stop offset="0%" stop-color="#22d3ee"/>
			<stop offset="100%" stop-color="#fbbf24"/>
		</linearGradient>
		<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
			<path d="M40 0H0v40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
		</pattern>
		<filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
			<feGaussianBlur stdDeviation="7" result="b"/>
			<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
		</filter>
	</defs>

	<rect width="1200" height="630" fill="url(#bg)"/>
	<rect width="1200" height="630" fill="url(#grid)"/>
	<rect width="1200" height="630" fill="url(#halo)"/>
	<rect x="0" y="0" width="1200" height="6" fill="#f59e0b" opacity="0.85"/>

	<!-- calls between actors -->
	<g stroke="url(#link)" stroke-width="3" stroke-linecap="round" opacity="0.75">
		<line x1="420" y1="170" x2="600" y2="260"/>
		<line x1="780" y1="170" x2="600" y2="260"/>
		<line x1="600" y1="260" x2="420" y2="350"/>
		<line x1="600" y1="260" x2="780" y2="350"/>
	</g>

	<!-- messages in flight -->
	<g fill="#22d3ee" filter="url(#glow)">
		<circle cx="510" cy="215" r="6"/>
		<circle cx="690" cy="305" r="6"/>
	</g>
	<g fill="#fbbf24" filter="url(#glow)">
		<circle cx="690" cy="215" r="6"/>
		<circle cx="510" cy="305" r="6"/>
	</g>

	<!-- outer actors, each with a mailbox queue -->
	<g fill="#0d1428" stroke="#22d3ee" stroke-width="3">
		<circle cx="400" cy="160" r="38"/>
		<circle cx="800" cy="160" r="38"/>
		<circle cx="400" cy="360" r="38"/>
		<circle cx="800" cy="360" r="38"/>
	</g>
	<g fill="#22d3ee" opacity="0.55">
		<rect x="296" y="152" width="14" height="16" rx="3"/><rect x="316" y="152" width="14" height="16" rx="3"/><rect x="336" y="152" width="14" height="16" rx="3"/>
		<rect x="296" y="352" width="14" height="16" rx="3"/><rect x="316" y="352" width="14" height="16" rx="3"/>
		<rect x="850" y="152" width="14" height="16" rx="3"/><rect x="870" y="152" width="14" height="16" rx="3"/>
		<rect x="850" y="352" width="14" height="16" rx="3"/><rect x="870" y="352" width="14" height="16" rx="3"/><rect x="890" y="352" width="14" height="16" rx="3"/>
	</g>

	<!-- central actor: one call at a time -->
	<circle cx="600" cy="260" r="62" fill="#0d1428" stroke="#fbbf24" stroke-width="5" filter="url(#glow)"/>
	<g fill="none" stroke="#f8fafc" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
		<path d="M572 240h56"/>
		<path d="M572 260h40"/>
		<path d="M572 280h24"/>
	</g>
	<circle cx="622" cy="280" r="7" fill="#fbbf24"/>

	<text x="600" y="506" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="66" font-weight="700" fill="#f8fafc" letter-spacing="-1.5">Shiny Actors</text>
	<text x="600" y="556" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="500" fill="#fbbf24" opacity="0.95">Orleans-style virtual actors, anywhere .NET runs</text>
	<text x="600" y="598" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="19" fill="#94a3b8" opacity="0.75">shinyorg/actors</text>
</svg>

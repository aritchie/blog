<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="GitHub Mon">
	<defs>
		<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#0b1020"/>
			<stop offset="50%" stop-color="#161c3d"/>
			<stop offset="100%" stop-color="#0b1020"/>
		</linearGradient>
		<radialGradient id="halo" cx="50%" cy="42%" r="62%">
			<stop offset="0%" stop-color="#60a5fa" stop-opacity="0.30"/>
			<stop offset="60%" stop-color="#60a5fa" stop-opacity="0.07"/>
			<stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
		</radialGradient>
		<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
			<path d="M40 0H0v40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
		</pattern>
		<filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
			<feGaussianBlur stdDeviation="7" result="b"/>
			<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
		</filter>
	</defs>

	<rect width="1200" height="630" fill="url(#bg)"/>
	<rect width="1200" height="630" fill="url(#grid)"/>
	<rect width="1200" height="630" fill="url(#halo)"/>
	<rect x="0" y="0" width="1200" height="6" fill="#60a5fa" opacity="0.85"/>

	<g>

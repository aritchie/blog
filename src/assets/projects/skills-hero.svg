<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Shiny AI Skills">
	<defs>
		<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#0b1020"/>
			<stop offset="50%" stop-color="#161c3d"/>
			<stop offset="100%" stop-color="#0b1020"/>
		</linearGradient>
		<radialGradient id="halo" cx="50%" cy="42%" r="62%">
			<stop offset="0%" stop-color="#a78bfa" stop-opacity="0.30"/>
			<stop offset="60%" stop-color="#a78bfa" stop-opacity="0.07"/>
			<stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
		</radialGradient>
		<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
			<path d="M40 0H0v40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
		</pattern>
		<filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
			<feGaussianBlur stdDeviation="7" result="b"/>
			<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
		</filter>
	</defs>

	<rect width="1200" height="630" fill="url(#bg)"/>
	<rect width="1200" height="630" fill="url(#grid)"/>
	<rect width="1200" height="630" fill="url(#halo)"/>
	<rect x="0" y="0" width="1200" height="6" fill="#a78bfa" opacity="0.85"/>

	<rect x="470" y="160" width="260" height="220" rx="18" fill="#0d1428" stroke="#a78bfa" stroke-opacity="0.35" stroke-width="4"/>
	<rect x="500" y="145" width="260" height="220" rx="18" fill="#0d1428" stroke="#a78bfa" stroke-opacity="0.6" stroke-width="4"/>
	<rect x="530" y="130" width="260" height="220" rx="18" fill="#0d1428" stroke="#a78bfa" stroke-opacity="1" stroke-width="4" filter="url(#glow)"/>
	<text x="560" y="190" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="24" fill="#a78bfa">SKILL.md</text>
	<line x1="560" y1="225" x2="750" y2="225" stroke="#e2e8f0" stroke-opacity="0.55" stroke-width="6" stroke-linecap="round"/>
	<line x1="560" y1="255" x2="710" y2="255" stroke="#e2e8f0" stroke-opacity="0.45" stroke-width="6" stroke-linecap="round"/>
	<line x1="560" y1="285" x2="730" y2="285" stroke="#e2e8f0" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round"/>
	<line x1="560" y1="315" x2="680" y2="315" stroke="#e2e8f0" stroke-opacity="0.25" stroke-width="6" stroke-linecap="round"/>
	<path d="M850 100l12 30 30 12-30 12-12 30-12-30-30-12 30-12z" fill="#a78bfa" filter="url(#glow)"/>
	<path d="M900 190l6 15 15 6-15 6-6 15-6-15-15-6 15-6z" fill="#a78bfa" opacity="0.7"/>

	<text x="600" y="506" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="66" font-weight="700" fill="#f8fafc" letter-spacing="-1.5">Shiny AI Skills</text>
	<text x="600" y="556" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="500" fill="#a78bfa" opacity="0.95">Teach your coding agent every Shiny library</text>
	<text x="600" y="598" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="19" fill="#94a3b8" opacity="0.75">shinyorg/skills</text>
</svg>

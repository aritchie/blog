	<text x="600" y="556" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="500" fill="#fbbf24" opacity="0.95">Scan &amp; extract, entirely on-device</text>

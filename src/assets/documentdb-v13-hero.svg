<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="doorway" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.10"/>
    </linearGradient>
    <radialGradient id="netGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.3" opacity="0.3"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <ellipse cx="600" cy="265" rx="540" ry="275" fill="url(#netGlow)"/>

  <!-- ===== the front door (centre) ===== -->
  <g transform="translate(600, 96)">
    <!-- archway -->
    <path d="M-118,300 L-118,60 A118,118 0 0 1 118,60 L118,300 Z" fill="url(#doorway)" stroke="#22d3ee" stroke-width="1.6" opacity="0.9"/>
    <path d="M-92,300 L-92,64 A92,92 0 0 1 92,64 L92,300 Z" fill="#0b1220" stroke="#334155" stroke-width="1.2"/>

    <!-- store panel inside the doorway -->
    <g transform="translate(0, 96)">
      <ellipse cx="0" cy="-32" rx="58" ry="16" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.4"/>
      <path d="M-58,-32 L-58,44 A58,16 0 0 0 58,44 L58,-32" fill="#111827" stroke="#8b5cf6" stroke-width="1.4"/>
      <ellipse cx="0" cy="6" rx="58" ry="16" fill="none" stroke="#8b5cf6" stroke-width="1" opacity="0.5"/>
      <text x="0" y="-28" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="10">documents</text>
    </g>

    <!-- padlock over the store -->
    <g transform="translate(0, 224)" filter="url(#glow)">
      <path d="M-13,-8 v-9 a13,13 0 0 1 26,0 v9" fill="none" stroke="#34d399" stroke-width="3.4"/>
      <rect x="-19" y="-8" width="38" height="30" rx="5" fill="#0b1220" stroke="#34d399" stroke-width="2"/>
      <circle cx="0" cy="6" r="3.6" fill="#34d399"/>
    </g>
    <text x="0" y="272" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="11">enc:1:k1:…</text>
  </g>

  <!-- ===== inbound front-door clients (left) ===== -->
  <g font-family="system-ui" font-size="12" text-anchor="middle">
    <g>
      <rect x="64" y="126" width="158" height="34" rx="8" fill="#0b1220" stroke="#06b6d4" stroke-width="1.3"/>
      <text x="143" y="148" fill="#22d3ee">REST + SSE</text>
    </g>
    <g>
      <rect x="64" y="180" width="158" height="34" rx="8" fill="#0b1220" stroke="#06b6d4" stroke-width="1.3"/>
      <text x="143" y="202" fill="#22d3ee">MCP server</text>
    </g>
    <g>
      <rect x="64" y="234" width="158" height="34" rx="8" fill="#0b1220" stroke="#8b5cf6" stroke-width="1.3"/>
      <text x="143" y="256" fill="#a78bfa">AI tools</text>
    </g>
    <g>
      <rect x="64" y="288" width="158" height="34" rx="8" fill="#0b1220" stroke="#8b5cf6" stroke-width="1.3"/>
      <text x="143" y="310" fill="#a78bfa">OData</text>
    </g>
    <g>
      <rect x="64" y="342" width="158" height="34" rx="8" fill="#0b1220" stroke="#06b6d4" stroke-width="1.3"/>
      <text x="143" y="364" fill="#22d3ee">VectorData</text>
    </g>
    <text x="143" y="400" fill="#475569" font-size="11">one line each</text>
  </g>

  <g stroke="#06b6d4" stroke-width="1.2" fill="none" opacity="0.4">
    <path d="M222,143 C320,146 380,190 476,214"/>
    <path d="M222,197 C320,200 390,214 476,228"/>
  </g>
  <g stroke="#8b5cf6" stroke-width="1.2" fill="none" opacity="0.4">
    <path d="M222,251 C320,252 390,248 476,242"/>
    <path d="M222,305 C320,304 390,278 476,256"/>
  </g>
  <g stroke="#06b6d4" stroke-width="1.2" fill="none" opacity="0.4">
    <path d="M222,359 C320,356 390,304 476,270"/>
  </g>

  <!-- ===== outbox queue (right) ===== -->
  <g transform="translate(760, 128)">
    <text x="176" y="0" text-anchor="middle" fill="#475569" font-family="system-ui" font-size="11" letter-spacing="1">TRANSACTIONAL OUTBOX</text>
    <g font-family="monospace" font-size="11">
      <g>
        <rect x="72" y="16" width="208" height="30" rx="6" fill="#0b1220" stroke="#10b981" stroke-width="1.3"/>
        <circle cx="90" cy="31" r="4" fill="#34d399"/>
        <text x="104" y="35" fill="#34d399">OrderPlaced</text>
      </g>
      <g>
        <rect x="72" y="54" width="208" height="30" rx="6" fill="#0b1220" stroke="#10b981" stroke-width="1.3"/>
        <circle cx="90" cy="69" r="4" fill="#34d399"/>
        <text x="104" y="73" fill="#34d399">OrderShipped</text>
      </g>
      <g>
        <rect x="72" y="92" width="208" height="30" rx="6" fill="#0b1220" stroke="#475569" stroke-width="1.3"/>
        <circle cx="90" cy="107" r="4" fill="#64748b"/>
        <text x="104" y="111" fill="#64748b">InvoiceIssued</text>
      </g>
      <g>
        <rect x="72" y="130" width="208" height="30" rx="6" fill="#0b1220" stroke="#475569" stroke-width="1.3"/>
        <circle cx="90" cy="145" r="4" fill="#64748b"/>
        <text x="104" y="149" fill="#64748b">StockReserved</text>
      </g>
    </g>
    <!-- dispatch arrow -->
    <path d="M176,172 L176,206" stroke="#34d399" stroke-width="1.8" fill="none" marker-end="url(#arrow)" opacity="0.9"/>
    <text x="176" y="228" text-anchor="middle" fill="#34d399" font-family="system-ui" font-size="12">dispatch</text>
    <text x="176" y="252" text-anchor="middle" fill="#475569" font-family="system-ui" font-size="11">same transaction as the write</text>
  </g>

  <!-- store -> outbox link -->
  <g stroke="#10b981" stroke-width="1.4" fill="none" opacity="0.45">
    <path d="M724,220 C780,200 790,176 832,160"/>
  </g>

  <!-- Orleans streams pill -->
  <g font-family="system-ui" font-size="12" text-anchor="middle">
    <rect x="832" y="412" width="208" height="34" rx="17" fill="#0b1220" stroke="#8b5cf6" stroke-width="1.3"/>
    <text x="936" y="434" fill="#a78bfa">Orleans streams</text>
  </g>

  <!-- v13 badge -->
  <g filter="url(#glow)">
    <rect x="546" y="40" width="108" height="38" rx="19" fill="#8b5cf6" fill-opacity="0.18" stroke="#a78bfa" stroke-width="1.6"/>
    <text x="600" y="66" text-anchor="middle" fill="#c4b5fd" font-family="system-ui" font-size="19" font-weight="bold">v13</text>
  </g>

  <!-- ===== title ===== -->
  <text x="600" y="512" text-anchor="middle" fill="#f1f5f9" font-family="system-ui" font-size="50" font-weight="bold" filter="url(#softGlow)">Shiny.DocumentDb v13</text>
  <text x="600" y="556" text-anchor="middle" fill="#22d3ee" font-family="system-ui" font-size="27" font-weight="600">Encryption, an Outbox, and a Front Door</text>
  <text x="600" y="592" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="15">AES-256-GCM at rest · REST + SSE · MCP · Orleans streams</text>

  <!-- decorative dots -->
  <circle cx="56" cy="72" r="3" fill="#22d3ee" opacity="0.5"/>
  <circle cx="80" cy="52" r="2" fill="#a78bfa" opacity="0.4"/>
  <circle cx="44" cy="452" r="2.5" fill="#34d399" opacity="0.4"/>
  <circle cx="1148" cy="72" r="3" fill="#a78bfa" opacity="0.5"/>
  <circle cx="1124" cy="52" r="2" fill="#22d3ee" opacity="0.4"/>
  <circle cx="1156" cy="452" r="2.5" fill="#34d399" opacity="0.4"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="hero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="glowL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.3" opacity="0.3"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <ellipse cx="300" cy="300" rx="300" ry="260" fill="url(#glowL)"/>
  <ellipse cx="900" cy="300" rx="320" ry="240" fill="url(#glowR)"/>

  <!-- ===== the release server, top centre ===== -->
  <g transform="translate(440, 34)" filter="url(#glow)">
    <rect x="0" y="0" width="320" height="58" rx="12" fill="url(#chrome)" stroke="#34d399" stroke-width="1.4"/>
    <text x="160" y="25" text-anchor="middle" fill="#6ee7b7" font-family="monospace" font-size="13">releases / 1.4.0.zip</text>
    <text x="160" y="44" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="11">ECDSA P-256 signed · your server, your schedule</text>
  </g>
  <!-- update flowing down to the phone -->
  <g fill="none" stroke="#34d399" stroke-width="1.6" stroke-dasharray="5 6" opacity="0.8">
    <path d="M440,63 C350,63 300,90 300,118"/>
  </g>
  <polygon points="294,114 306,114 300,124" fill="#34d399"/>
  <!-- no store in the way -->
  <g font-family="system-ui" font-size="11" fill="#64748b">
    <text x="336" y="84">no review queue</text>
  </g>

  <!-- ===== the phone, left ===== -->
  <g transform="translate(205, 128)">
    <rect x="0" y="0" width="190" height="330" rx="28" fill="#0b1220" stroke="#475569" stroke-width="2"/>
    <rect x="72" y="10" width="46" height="8" rx="4" fill="#1e293b"/>
    <rect x="10" y="26" width="170" height="294" rx="16" fill="#f4f4fb"/>
    <!-- the web app -->
    <rect x="20" y="38" width="150" height="86" rx="12" fill="url(#hero)"/>
    <rect x="30" y="48" width="64" height="9" rx="4.5" fill="#ffffff" opacity="0.35"/>
    <text x="30" y="76" fill="#ffffff" font-family="system-ui" font-weight="700" font-size="13">Your web app,</text>
    <text x="30" y="92" fill="#ffffff" font-family="system-ui" font-weight="700" font-size="13">with a device</text>
    <text x="30" y="108" fill="#ffffff" font-family="system-ui" font-weight="700" font-size="13">behind it</text>
    <g font-family="system-ui" font-size="10" fill="#1e1b4b">
      <rect x="20" y="136" width="72" height="34" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="30" y="157">gps</text><circle cx="80" cy="153" r="3.5" fill="#10b981"/>
      <rect x="98" y="136" width="72" height="34" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="108" y="157">ble</text><circle cx="158" cy="153" r="3.5" fill="#10b981"/>
      <rect x="20" y="178" width="72" height="34" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="30" y="199">wifi</text><circle cx="80" cy="195" r="3.5" fill="#10b981"/>
      <rect x="98" y="178" width="72" height="34" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="108" y="199">camera</text><circle cx="158" cy="195" r="3.5" fill="#10b981"/>
      <rect x="20" y="220" width="72" height="34" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="30" y="241">health</text><circle cx="80" cy="237" r="3.5" fill="#10b981"/>
      <rect x="98" y="220" width="72" height="34" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="108" y="241">push</text><circle cx="158" cy="237" r="3.5" fill="#10b981"/>
    </g>
    <rect x="20" y="266" width="150" height="42" rx="8" fill="#111827"/>
    <text x="28" y="283" fill="#a78bfa" font-family="monospace" font-size="8.5">GET /_bridge/wifi/current</text>
    <text x="28" y="298" fill="#6ee7b7" font-family="monospace" font-size="8.5">200 "Harbourfront Café"</text>
  </g>

  <!-- hot reload from the dev machine -->
  <g transform="translate(60, 250)" filter="url(#glow)">
    <rect x="0" y="0" width="118" height="70" rx="10" fill="url(#chrome)" stroke="#f472b6" stroke-width="1.3"/>
    <text x="59" y="24" text-anchor="middle" fill="#f9a8d4" font-family="monospace" font-size="11">dotnet watch</text>
    <text x="59" y="42" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="10">Home.razor</text>
    <text x="59" y="58" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="10">saved</text>
  </g>
  <g fill="none" stroke="#f472b6" stroke-width="1.6" stroke-dasharray="5 6" opacity="0.85">
    <path d="M178,285 L203,285"/>
  </g>
  <polygon points="200,279 200,291 210,285" fill="#f472b6"/>
  <text x="119" y="340" text-anchor="middle" fill="#f9a8d4" font-family="system-ui" font-size="11">hot reload, in the real app</text>

  <!-- ===== the simulator, right ===== -->
  <g transform="translate(620, 128)">
    <rect x="0" y="0" width="520" height="330" rx="14" fill="url(#chrome)" stroke="#334155" stroke-width="1.5"/>
    <path d="M0,14 a14,14 0 0 1 14,-14 h492 a14,14 0 0 1 14,14 v22 h-520 z" fill="#0b1220"/>
    <circle cx="20" cy="18" r="4.5" fill="#ef4444" opacity="0.75"/>
    <circle cx="36" cy="18" r="4.5" fill="#f59e0b" opacity="0.75"/>
    <circle cx="52" cy="18" r="4.5" fill="#10b981" opacity="0.75"/>
    <text x="76" y="22" fill="#64748b" font-family="system-ui" font-size="11">shiny-bridge-sim</text>
    <line x1="0" y1="36" x2="520" y2="36" stroke="#334155" stroke-width="1"/>

    <text x="18" y="58" font-family="monospace" font-size="11.5" xml:space="preserve"><tspan fill="#67e8f9">◆ Simulator</tspan><tspan fill="#94a3b8">  serving </tspan><tspan fill="#67e8f9" text-decoration="underline">127.0.0.1:5299</tspan><tspan fill="#94a3b8">  as </tspan><tspan fill="#a78bfa">ios</tspan></text>

    <g font-family="monospace" font-size="11">
      <rect x="16" y="70" width="70" height="22" rx="4" fill="none" stroke="#60a5fa"/><text x="51" y="85" text-anchor="middle" fill="#93c5fd">Bridges</text>
      <rect x="92" y="70" width="70" height="22" rx="4" fill="none" stroke="#475569"/><text x="127" y="85" text-anchor="middle" fill="#cbd5e1">Traffic</text>
      <rect x="168" y="70" width="62" height="22" rx="4" fill="none" stroke="#475569"/><text x="199" y="85" text-anchor="middle" fill="#cbd5e1">Trails</text>
    </g>

    <!-- tree -->
    <rect x="16" y="102" width="176" height="212" rx="4" fill="none" stroke="#3b82f6" stroke-opacity="0.6"/>
    <g font-family="monospace" font-size="11" fill="#e2e8f0">
      <text x="28" y="122"><tspan fill="#a78bfa">⌂ host</tspan><tspan fill="#94a3b8"> ios</tspan></text>
      <text x="28" y="140">▸ ◇ ble</text>
      <text x="28" y="158">▸ ◇ camera</text>
      <text x="28" y="176">▸ ◇ gps</text>
      <text x="28" y="194">▸ ◇ health</text>
      <text x="28" y="212">▸ ◇ tray <tspan fill="#f87171">off</tspan></text>
      <text x="28" y="230">▾ ◇ wifi</text>
      <text x="44" y="248"><tspan fill="#93c5fd">GET</tspan>    networks</text>
      <text x="36" y="266"><tspan fill="#60a5fa">→</tspan><tspan fill="#93c5fd">GET</tspan>    <tspan fill="#60a5fa">current</tspan> <tspan fill="#34d399">●</tspan></text>
      <text x="44" y="284"><tspan fill="#34d399">POST</tspan>   connection</text>
      <text x="44" y="302"><tspan fill="#c084fc">⚡ wifi.changed</tspan></text>
    </g>

    <!-- route editor -->
    <g font-family="monospace" font-size="11">
      <text x="208" y="122"><tspan fill="#93c5fd">GET</tspan><tspan fill="#e2e8f0">  /_bridge/wifi/current</tspan></text>
      <text x="208" y="142" fill="#94a3b8">Answer</text>
      <rect x="262" y="130" width="130" height="18" rx="3" fill="#0b1220" stroke="#f87171" stroke-opacity="0.8"/>
      <text x="270" y="143" fill="#fca5a5">403 access_denied ▾</text>
      <text x="404" y="142" fill="#94a3b8">delay <tspan fill="#fb923c">1500</tspan></text>
      <rect x="208" y="158" width="296" height="104" rx="4" fill="#0b1220"/>
      <text x="218" y="178" fill="#e2e8f0">{</text>
      <text x="230" y="196"><tspan fill="#e2e8f0">"code"</tspan><tspan fill="#64748b">: </tspan><tspan fill="#34d399">"access_denied"</tspan><tspan fill="#64748b">,</tspan></text>
      <text x="230" y="214"><tspan fill="#e2e8f0">"message"</tspan><tspan fill="#64748b">: </tspan><tspan fill="#34d399">"User said no"</tspan></text>
      <text x="218" y="232" fill="#e2e8f0">}</text>
      <rect x="208" y="276" width="76" height="20" rx="3" fill="#3b82f6"/><text x="246" y="290" text-anchor="middle" fill="#ffffff">Apply F5</text>
      <text x="296" y="290" fill="#94a3b8">▶ Harbourfront ride  10/36</text>
    </g>
  </g>

  <!-- a GPX trail wandering under the simulator -->
  <g filter="url(#softGlow)" opacity="0.9">
    <path d="M660,490 C700,470 740,500 790,478 S880,452 930,470 S1030,500 1100,472" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round"/>
    <circle cx="930" cy="470" r="6" fill="#67e8f9"/>
  </g>
  <text x="880" y="508" text-anchor="middle" fill="#67e8f9" font-family="system-ui" font-size="11">harbourfront.gpx → gps.reading</text>

  <!-- ===== headline ===== -->
  <g font-family="system-ui" text-anchor="middle">
    <text x="600" y="560" fill="url(#title)" font-size="46" font-weight="800" filter="url(#glow)">Shiny.AppDeviceBridge</text>
    <text x="600" y="596" fill="#cbd5e1" font-size="18">Ship on your schedule · Hot reload in the real app · Test the device without the device</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="barFill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="60%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="netGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.3" opacity="0.3"/>
    </pattern>
    <marker id="arrowUp" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#22d3ee"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Glow orbs -->
  <circle cx="210" cy="290" r="210" fill="#06b6d4" opacity="0.05" filter="url(#softGlow)"/>
  <circle cx="1000" cy="300" r="220" fill="#8b5cf6" opacity="0.06" filter="url(#softGlow)"/>
  <circle cx="600" cy="250" r="180" fill="#10b981" opacity="0.04" filter="url(#softGlow)"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#accentCyan)"/>

  <!-- app suspended chip, top-right -->
  <g transform="translate(1002, 30)">
    <rect width="168" height="32" rx="16" fill="#1e1b4b" stroke="#f472b6" stroke-width="1.5"/>
    <circle cx="22" cy="16" r="5" fill="#f472b6"/>
    <text x="94" y="22" text-anchor="middle" fill="#fbcfe8" font-family="monospace" font-size="13" font-weight="bold">app suspended</text>
  </g>

  <!-- LEFT: phone with lock-screen progress surface -->
  <g transform="translate(95, 140)">
    <rect x="0" y="0" width="210" height="310" rx="24" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect x="12" y="14" width="186" height="282" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <rect x="82" y="4" width="46" height="7" rx="3.5" fill="#334155"/>

    <!-- dynamic island / chip -->
    <g transform="translate(62, 26)">
      <rect width="86" height="24" rx="12" fill="#020617" stroke="#22d3ee" stroke-width="1"/>
      <circle cx="18" cy="12" r="5" fill="none" stroke="#22d3ee" stroke-width="2"/>
      <text x="56" y="17" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="11" font-weight="bold">41%</text>
    </g>

    <text x="105" y="82" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="11">LOCK SCREEN</text>

    <!-- live activity card -->
    <g transform="translate(26, 96)">
      <rect width="158" height="112" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
      <text x="14" y="26" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="bold">Uploading</text>
      <text x="14" y="44" fill="#94a3b8" font-family="monospace" font-size="10">receipt.pdf</text>

      <rect x="14" y="56" width="130" height="8" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
      <rect x="14" y="56" width="53" height="8" rx="4" fill="url(#barFill)"/>

      <text x="14" y="82" fill="#22d3ee" font-family="monospace" font-size="10">12 MB of 48 MB</text>
      <text x="14" y="98" fill="#34d399" font-family="monospace" font-size="10">1.5 MB/s · 23s left</text>
    </g>

    <!-- foreground service badge -->
    <g transform="translate(26, 224)">
      <rect width="158" height="26" rx="13" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="79" y="17" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">one surface · both OSes</text>
    </g>
    <g transform="translate(26, 258)">
      <rect width="158" height="26" rx="13" fill="#0f172a" stroke="#a78bfa" stroke-width="1"/>
      <text x="79" y="17" text-anchor="middle" fill="#c4b5fd" font-family="monospace" font-size="10">AddTransferProgress()</text>
    </g>
  </g>

  <!-- CENTER: the OS carries the bytes -->
  <g transform="translate(320, 0)">
    <circle cx="290" cy="300" r="150" fill="url(#netGlow)"/>

    <path d="M 5 262 C 150 232, 430 232, 570 262" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-dasharray="6,5" marker-end="url(#arrowUp)"/>
    <g transform="translate(212, 206)">
      <rect width="150" height="28" rx="14" fill="#1e1b4b" stroke="#22d3ee" stroke-width="1"/>
      <text x="75" y="19" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="11" font-weight="bold">bytes keep moving</text>
    </g>

    <text x="288" y="302" text-anchor="middle" fill="#c4b5fd" font-family="monospace" font-size="12" font-weight="bold">NSURLSession · ForegroundService · HttpClient loop</text>
    <text x="288" y="322" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="11">Service Worker Background Sync</text>

    <!-- metrics readout -->
    <g transform="translate(120, 350)">
      <rect width="340" height="96" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
      <text x="16" y="26" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="bold">TransferProgress</text>
      <line x1="16" y1="34" x2="324" y2="34" stroke="#334155" stroke-width="0.8"/>
      <text x="16" y="54" fill="#22d3ee" font-family="monospace" font-size="11">BytesPerSecond</text>
      <text x="324" y="54" text-anchor="end" fill="#e2e8f0" font-family="monospace" font-size="11">1,572,864</text>
      <text x="16" y="72" fill="#34d399" font-family="monospace" font-size="11">PercentComplete</text>
      <text x="324" y="72" text-anchor="end" fill="#e2e8f0" font-family="monospace" font-size="11">0.41</text>
      <text x="16" y="90" fill="#c4b5fd" font-family="monospace" font-size="11">EstimatedTimeRemaining</text>
      <text x="324" y="90" text-anchor="end" fill="#e2e8f0" font-family="monospace" font-size="11">00:00:23</text>
    </g>
  </g>

  <!-- RIGHT: server cylinder -->
  <g transform="translate(915, 170)">
    <ellipse cx="100" cy="20" rx="100" ry="24" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="20" width="200" height="150" fill="#1e293b" stroke="none"/>
    <line x1="0" y1="20" x2="0" y2="170" stroke="#334155" stroke-width="1.5"/>
    <line x1="200" y1="20" x2="200" y2="170" stroke="#334155" stroke-width="1.5"/>
    <ellipse cx="100" cy="170" rx="100" ry="24" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <ellipse cx="100" cy="20" rx="100" ry="24" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5" opacity="0.9"/>
    <ellipse cx="100" cy="70" rx="100" ry="24" fill="none" stroke="#334155" stroke-width="0.8" opacity="0.5"/>
    <ellipse cx="100" cy="120" rx="100" ry="24" fill="none" stroke="#334155" stroke-width="0.8" opacity="0.5"/>

    <text x="100" y="62"  text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="13" font-weight="bold">S3 · Blob · your API</text>
    <text x="100" y="102" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="11">multipart / raw</text>
    <text x="100" y="138" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="11">Range: bytes=N-</text>

    <text x="100" y="220" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="13">resumable downloads</text>
  </g>

  <!-- Feature pills along the bottom -->
  <g transform="translate(112, 498)">
    <rect width="196" height="32" rx="16" fill="#1e293b" stroke="#06b6d4" stroke-width="1.2"/>
    <text x="98" y="21" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="12" font-weight="bold">Survives App Kill</text>
  </g>
  <g transform="translate(326, 498)">
    <rect width="176" height="32" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
    <text x="88" y="21" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold">Pause / Resume</text>
  </g>
  <g transform="translate(520, 498)">
    <rect width="186" height="32" rx="16" fill="#1e293b" stroke="#a78bfa" stroke-width="1.2"/>
    <text x="93" y="21" text-anchor="middle" fill="#c4b5fd" font-family="monospace" font-size="12" font-weight="bold">Sampled Throughput</text>
  </g>
  <g transform="translate(724, 498)">
    <rect width="168" height="32" rx="16" fill="#1e293b" stroke="#f472b6" stroke-width="1.2"/>
    <text x="84" y="21" text-anchor="middle" fill="#f472b6" font-family="monospace" font-size="12" font-weight="bold">Live Activity</text>
  </g>
  <g transform="translate(910, 498)">
    <rect width="178" height="32" rx="16" fill="#1e293b" stroke="#eab308" stroke-width="1.2"/>
    <text x="89" y="21" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="12" font-weight="bold">Wi-Fi Only Mode</text>
  </g>

  <!-- Title -->
  <text x="600" y="578" text-anchor="middle" fill="#f8fafc" font-family="monospace" font-size="28" font-weight="bold" filter="url(#glow)">Shiny.Net.Http</text>
  <text x="600" y="606" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="13">Background transfers · and knowing what they're doing</text>
</svg>

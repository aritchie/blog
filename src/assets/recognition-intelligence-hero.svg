<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="violet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <!-- userSpaceOnUse: the waveform bars are vertical lines with a zero-width bounding box,
         so an objectBoundingBox gradient would refuse to paint them. -->
    <linearGradient id="violetBars" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="262" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="45%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="tri" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="glowCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#22d3ee" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="600" cy="330" rx="560" ry="330" fill="url(#glowCenter)"/>

  <!-- vector-space dot grid -->
  <g fill="#a78bfa" opacity="0.18">
    <circle cx="120" cy="120" r="3"/><circle cx="240" cy="80" r="2"/><circle cx="1060" cy="150" r="3"/>
    <circle cx="980" cy="90" r="2"/><circle cx="150" cy="520" r="2"/><circle cx="1080" cy="480" r="3"/>
    <circle cx="300" cy="560" r="2"/><circle cx="900" cy="560" r="2"/><circle cx="60" cy="300" r="2"/>
    <circle cx="1140" cy="320" r="2"/>
  </g>

  <!-- title -->
  <text x="600" y="140" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="66" font-weight="700" fill="#f8fafc" letter-spacing="-1">Recognition Intelligence</text>
  <text x="600" y="192" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="27" font-weight="500" fill="#94a3b8">Faces · Voices · Documents — entirely on-device, in .NET MAUI</text>

  <!-- three panels -->
  <g>
    <!-- FACE -->
    <g transform="translate(120,260)">
      <rect x="0" y="0" width="300" height="230" rx="20" fill="#111827" fill-opacity="0.72" stroke="#22d3ee" stroke-opacity="0.45" stroke-width="2"/>
      <g stroke="url(#cyan)" stroke-width="4" fill="none" stroke-linecap="round" filter="url(#soft)">
        <path d="M70 60 L70 42 Q70 34 78 34 L96 34"/>
        <path d="M230 60 L230 42 Q230 34 222 34 L204 34"/>
        <path d="M70 148 L70 166 Q70 174 78 174 L96 174"/>
        <path d="M230 148 L230 166 Q230 174 222 174 L204 174"/>
      </g>
      <g opacity="0.95">
        <ellipse cx="150" cy="104" rx="46" ry="56" fill="none" stroke="#e2e8f0" stroke-opacity="0.55" stroke-width="2"/>
        <g fill="#22d3ee">
          <circle cx="133" cy="94" r="3.5"/><circle cx="167" cy="94" r="3.5"/>
          <circle cx="150" cy="112" r="3.5"/><circle cx="136" cy="130" r="3.5"/><circle cx="164" cy="130" r="3.5"/>
        </g>
        <g stroke="#22d3ee" stroke-opacity="0.5" stroke-width="1.5">
          <path d="M133 94 L167 94 M133 94 L150 112 M167 94 L150 112 M150 112 L136 130 M150 112 L164 130 M136 130 L164 130"/>
        </g>
      </g>
      <text x="150" y="205" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#e2e8f0">Face</text>
    </g>

    <!-- VOICE -->
    <g transform="translate(450,260)">
      <rect x="0" y="0" width="300" height="230" rx="20" fill="#111827" fill-opacity="0.72" stroke="#a78bfa" stroke-opacity="0.45" stroke-width="2"/>
      <!-- baseline + pulse rings behind the waveform -->
      <line x1="34" y1="104" x2="266" y2="104" stroke="#a78bfa" stroke-opacity="0.22" stroke-width="2"/>
      <circle cx="150" cy="104" r="76" fill="none" stroke="#a78bfa" stroke-opacity="0.14" stroke-width="2"/>
      <circle cx="150" cy="104" r="96" fill="none" stroke="#a78bfa" stroke-opacity="0.08" stroke-width="2"/>

      <g stroke="url(#violetBars)" stroke-width="9" stroke-linecap="round" filter="url(#soft)">
        <line x1="40"  y1="94"  x2="40"  y2="114"/>
        <line x1="62"  y1="78"  x2="62"  y2="130"/>
        <line x1="84"  y1="60"  x2="84"  y2="148"/>
        <line x1="106" y1="42"  x2="106" y2="166"/>
        <line x1="128" y1="38"  x2="128" y2="170"/>
        <line x1="150" y1="64"  x2="150" y2="144"/>
        <line x1="172" y1="46"  x2="172" y2="162"/>
        <line x1="194" y1="74"  x2="194" y2="134"/>
        <line x1="216" y1="56"  x2="216" y2="152"/>
        <line x1="238" y1="82"  x2="238" y2="126"/>
        <line x1="260" y1="92"  x2="260" y2="116"/>
      </g>
      <text x="150" y="205" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#e2e8f0">Voice</text>
    </g>

    <!-- DOCUMENT -->
    <g transform="translate(780,260)">
      <rect x="0" y="0" width="300" height="230" rx="20" fill="#111827" fill-opacity="0.72" stroke="#34d399" stroke-opacity="0.45" stroke-width="2"/>
      <g filter="url(#soft)">
        <path d="M104 36 L176 36 L206 66 L206 172 L104 172 Z" fill="none" stroke="url(#green)" stroke-width="4" stroke-linejoin="round"/>
        <path d="M176 36 L176 66 L206 66" fill="none" stroke="url(#green)" stroke-width="4" stroke-linejoin="round"/>
      </g>
      <g stroke="#34d399" stroke-opacity="0.75" stroke-width="4" stroke-linecap="round">
        <path d="M124 92 L186 92"/><path d="M124 112 L186 112"/><path d="M124 132 L162 132"/>
      </g>
      <text x="150" y="205" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#e2e8f0">Document</text>
    </g>
  </g>

  <!-- footer strip -->
  <rect x="120" y="536" width="960" height="4" rx="2" fill="url(#tri)" opacity="0.85"/>
  <text x="600" y="580" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="500" fill="#94a3b8">
    ONNX Runtime · CameraView frame analyzer · DocumentDb + sqlite-vec · nothing leaves the device
  </text>
</svg>

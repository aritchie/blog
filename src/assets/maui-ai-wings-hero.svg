<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="feather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#512bd4"/>
      <stop offset="100%" stop-color="#00ccff"/>
    </linearGradient>
    <linearGradient id="feather2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ccff"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>
    <linearGradient id="phoneEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ccff"/>
      <stop offset="100%" stop-color="#512bd4"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- background glows -->
  <ellipse cx="600" cy="290" rx="470" ry="300" fill="#512bd4" opacity="0.14"/>
  <ellipse cx="300" cy="300" rx="250" ry="190" fill="#00ccff" opacity="0.07"/>
  <ellipse cx="900" cy="300" rx="250" ry="190" fill="#00ff88" opacity="0.06"/>

  <!-- eyebrow -->
  <text x="600" y="78" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-weight="300" font-size="17" fill="#ffffff" opacity="0.5" letter-spacing="7">SHINY  ·  .NET MAUI  ·  MICROSOFT.EXTENSIONS.AI</text>

  <!-- ===== left wing ===== -->
  <g opacity="0.92" filter="url(#softglow)">
    <g fill="url(#feather)" opacity="0.85">
      <path d="M520 250 C 400 210, 280 200, 190 226 C 280 246, 400 262, 520 268 Z"/>
      <path d="M520 286 C 390 266, 260 268, 168 300 C 262 314, 392 314, 520 302 Z"/>
      <path d="M520 320 C 402 318, 288 336, 208 372 C 306 372, 420 358, 520 336 Z"/>
      <path d="M522 352 C 428 366, 340 396, 282 432 C 366 420, 452 396, 524 366 Z"/>
    </g>
  </g>

  <!-- ===== right wing ===== -->
  <g opacity="0.92" filter="url(#softglow)">
    <g fill="url(#feather2)" opacity="0.8">
      <path d="M680 250 C 800 210, 920 200, 1010 226 C 920 246, 800 262, 680 268 Z"/>
      <path d="M680 286 C 810 266, 940 268, 1032 300 C 938 314, 808 314, 680 302 Z"/>
      <path d="M680 320 C 798 318, 912 336, 992 372 C 894 372, 780 358, 680 336 Z"/>
      <path d="M678 352 C 772 366, 860 396, 918 432 C 834 420, 748 396, 676 366 Z"/>
    </g>
  </g>

  <!-- ===== phone in the middle ===== -->
  <g transform="translate(600,318)">
    <rect x="-92" y="-152" width="184" height="304" rx="30" fill="#0b1220" stroke="url(#phoneEdge)" stroke-width="2.5"/>
    <rect x="-30" y="-146" width="60" height="10" rx="5" fill="#1e1b4b"/>

    <!-- chat bubbles -->
    <rect x="-72" y="-116" width="112" height="30" rx="13" fill="#2a2854"/>
    <rect x="-72" y="-78" width="86" height="24" rx="11" fill="#2a2854"/>
    <rect x="-8" y="-42" width="80" height="26" rx="12" fill="url(#feather)"/>
    <rect x="-72" y="-6" width="124" height="34" rx="14" fill="#2a2854"/>
    <rect x="-72" y="36" width="96" height="24" rx="11" fill="#2a2854"/>
    <rect x="4" y="70" width="68" height="24" rx="11" fill="url(#feather)"/>

    <!-- input bar -->
    <rect x="-72" y="112" width="112" height="26" rx="13" fill="none" stroke="#3a3a5e" stroke-width="1.5"/>
    <circle cx="58" cy="125" r="13" fill="url(#feather)"/>
  </g>

  <!-- tool chips orbiting -->
  <g font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="600" fill="#ffffff">
    <g transform="translate(214,180)">
      <rect x="-56" y="-16" width="112" height="32" rx="16" fill="#0b1220" stroke="#00ccff" stroke-width="1.3" opacity="0.95"/>
      <text x="0" y="5" text-anchor="middle">Contacts</text>
    </g>
    <g transform="translate(150,470)">
      <rect x="-60" y="-16" width="120" height="32" rx="16" fill="#0b1220" stroke="#00ccff" stroke-width="1.3" opacity="0.95"/>
      <text x="0" y="5" text-anchor="middle">Reminders</text>
    </g>
    <g transform="translate(352,516)">
      <rect x="-52" y="-16" width="104" height="32" rx="16" fill="#0b1220" stroke="#00ccff" stroke-width="1.3" opacity="0.95"/>
      <text x="0" y="5" text-anchor="middle">Location</text>
    </g>
    <g transform="translate(986,180)">
      <rect x="-46" y="-16" width="92" height="32" rx="16" fill="#0b1220" stroke="#00ff88" stroke-width="1.3" opacity="0.95"/>
      <text x="0" y="5" text-anchor="middle">Health</text>
    </g>
    <g transform="translate(1046,470)">
      <rect x="-44" y="-16" width="88" height="32" rx="16" fill="#0b1220" stroke="#00ff88" stroke-width="1.3" opacity="0.95"/>
      <text x="0" y="5" text-anchor="middle">Music</text>
    </g>
    <g transform="translate(848,516)">
      <rect x="-56" y="-16" width="112" height="32" rx="16" fill="#0b1220" stroke="#00ff88" stroke-width="1.3" opacity="0.95"/>
      <text x="0" y="5" text-anchor="middle">DocumentDb</text>
    </g>
  </g>

  <!-- title -->
  <text x="600" y="560" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-weight="700" font-size="46" fill="#ffffff" filter="url(#glow)">A real set of AI Wings</text>
  <text x="600" y="596" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-weight="300" font-size="19" fill="#ffffff" opacity="0.62">Copilot in the chat, Shiny on the device</text>
</svg>

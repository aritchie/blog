<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="node" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#512bd4"/>
      <stop offset="100%" stop-color="#00ccff"/>
    </linearGradient>
    <linearGradient id="wire" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#512bd4"/>
      <stop offset="100%" stop-color="#00ccff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- background glows -->
  <ellipse cx="600" cy="250" rx="420" ry="300" fill="#512bd4" opacity="0.12"/>
  <ellipse cx="300" cy="360" rx="240" ry="200" fill="#00ccff" opacity="0.07"/>
  <ellipse cx="900" cy="360" rx="240" ry="200" fill="#00ff88" opacity="0.06"/>

  <!-- eyebrow -->
  <text x="600" y="92" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-weight="300" font-size="18" fill="#ffffff" opacity="0.5" letter-spacing="7">SHINY FOR .NET MAUI</text>

  <!-- connecting wires from brain to the three tools -->
  <g stroke="url(#wire)" stroke-width="2" fill="none" opacity="0.55" stroke-dasharray="7,5">
    <path d="M600 250 C 420 250, 360 300, 300 300"/>
    <path d="M600 250 C 600 290, 600 290, 600 300"/>
    <path d="M600 250 C 780 250, 840 300, 900 300"/>
  </g>

  <!-- central AI brain node -->
  <g transform="translate(600,250)">
    <circle r="58" fill="none" stroke="#00ccff" stroke-width="2" opacity="0.6"/>
    <circle r="36" fill="none" stroke="#00ccff" stroke-width="1.5" opacity="0.5"/>
    <circle r="16" fill="url(#node)" filter="url(#glow)"/>
    <g stroke="#00ccff" stroke-width="1" opacity="0.5">
      <line x1="-58" y1="0" x2="58" y2="0"/>
      <line x1="0" y1="-58" x2="0" y2="58"/>
      <line x1="-41" y1="-41" x2="41" y2="41"/>
      <line x1="41" y1="-41" x2="-41" y2="41"/>
    </g>
  </g>

  <!-- Tool 1: Contacts (person) -->
  <g transform="translate(300,300)">
    <rect x="-70" y="0" width="140" height="96" rx="14" fill="#0b1220" stroke="#00ccff" stroke-width="1.5" opacity="0.9"/>
    <g transform="translate(0,34)" stroke="#00ccff" stroke-width="2.5" fill="none">
      <circle cx="0" cy="-6" r="11"/>
      <path d="M-18 22 C -18 4, 18 4, 18 22"/>
    </g>
    <text x="0" y="82" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-weight="600" font-size="15" fill="#ffffff">Contacts</text>
  </g>

  <!-- Tool 2: Reminders (bell) -->
  <g transform="translate(600,300)">
    <rect x="-70" y="0" width="140" height="96" rx="14" fill="#0b1220" stroke="#9966ff" stroke-width="1.5" opacity="0.9"/>
    <g transform="translate(0,30)" stroke="#9966ff" stroke-width="2.5" fill="none" stroke-linecap="round">
      <path d="M-14 12 C -14 -6, -8 -14, 0 -14 C 8 -14, 14 -6, 14 12 L 18 16 L -18 16 Z"/>
      <path d="M-5 20 C -5 25, 5 25, 5 20"/>
    </g>
    <text x="0" y="82" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-weight="600" font-size="15" fill="#ffffff">Reminders</text>
  </g>

  <!-- Tool 3: Location (pin) -->
  <g transform="translate(900,300)">
    <rect x="-70" y="0" width="140" height="96" rx="14" fill="#0b1220" stroke="#00ff88" stroke-width="1.5" opacity="0.9"/>
    <g transform="translate(0,20)" stroke="#00ff88" stroke-width="2.5" fill="none">
      <path d="M0 40 C 0 40, -16 20, -16 8 A 16 16 0 1 1 16 8 C 16 20, 0 40, 0 40 Z"/>
      <circle cx="0" cy="8" r="5"/>
    </g>
    <text x="0" y="82" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-weight="600" font-size="15" fill="#ffffff">Location</text>
  </g>

  <!-- headline -->
  <text x="600" y="480" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-weight="800" font-size="54" fill="#ffffff">Give Your Agent Hands</text>
  <text x="600" y="528" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-weight="300" font-size="24" fill="#00ccff" opacity="0.8">Device services as Microsoft.Extensions.AI tools</text>

  <!-- bottom pills -->
  <g font-family="system-ui,-apple-system,sans-serif" font-size="12" text-anchor="middle">
    <rect x="360" y="575" width="150" height="28" rx="14" fill="none" stroke="#512bd4" stroke-width="1" opacity="0.6"/>
    <text x="435" y="593" fill="#8b7fe0" opacity="0.95">Opt-in Capabilities</text>

    <rect x="525" y="575" width="150" height="28" rx="14" fill="none" stroke="#00ccff" stroke-width="1" opacity="0.6"/>
    <text x="600" y="593" fill="#00ccff" opacity="0.95">Read-only by Default</text>

    <rect x="690" y="575" width="150" height="28" rx="14" fill="none" stroke="#00ff88" stroke-width="1" opacity="0.6"/>
    <text x="765" y="593" fill="#00ff88" opacity="0.95">AOT-safe</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="hero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="glowC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.3" opacity="0.3"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <ellipse cx="600" cy="230" rx="300" ry="230" fill="url(#glowC)"/>
  <ellipse cx="170" cy="250" rx="220" ry="220" fill="url(#glowL)"/>
  <ellipse cx="1030" cy="250" rx="220" ry="220" fill="url(#glowR)"/>

  <!-- ===== links: host to each client ===== -->
  <!-- BLE: host -> left phone -->
  <g fill="none" stroke="#67e8f9" stroke-width="1.8" stroke-dasharray="5 6" opacity="0.85">
    <path d="M500,200 C420,190 330,190 250,200"/>
    <path d="M500,250 C420,262 330,262 250,250"/>
  </g>
  <polygon points="254,194 254,206 244,200" fill="#67e8f9"/>
  <polygon points="496,244 496,256 506,250" fill="#67e8f9"/>
  <g transform="translate(375, 225)" filter="url(#softGlow)">
    <circle cx="0" cy="0" r="17" fill="#1e293b" stroke="#67e8f9" stroke-width="1.6"/>
    <path d="M-5,-6 L5,4 L0,9 L0,-9 L5,-4 L-5,6" fill="none" stroke="#67e8f9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="375" y="180" text-anchor="middle" fill="#67e8f9" font-family="monospace" font-size="11">GATT · L2CAP</text>

  <!-- Wi-Fi: host -> right phone -->
  <g fill="none" stroke="#34d399" stroke-width="1.8" stroke-dasharray="5 6" opacity="0.85">
    <path d="M700,200 C780,190 870,190 950,200"/>
    <path d="M700,250 C780,262 870,262 950,250"/>
  </g>
  <polygon points="946,194 946,206 956,200" fill="#34d399"/>
  <polygon points="704,244 704,256 694,250" fill="#34d399"/>
  <g transform="translate(825, 225)" filter="url(#softGlow)">
    <circle cx="0" cy="0" r="17" fill="#1e293b" stroke="#34d399" stroke-width="1.6"/>
    <g fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round">
      <path d="M-9,-2 A13,13 0 0 1 9,-2"/>
      <path d="M-5.5,2.5 A8,8 0 0 1 5.5,2.5"/>
    </g>
    <circle cx="0" cy="7" r="1.8" fill="#34d399"/>
  </g>
  <text x="825" y="180" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="11">SSE ↓ · POST ↑ · mDNS</text>

  <!-- tunnel: up to the globe -->
  <g fill="none" stroke="#fb923c" stroke-width="1.8" stroke-dasharray="4 6" opacity="0.75">
    <path d="M600,108 L600,72"/>
  </g>
  <g transform="translate(600, 50)">
    <circle cx="0" cy="0" r="20" fill="#1e293b" stroke="#fb923c" stroke-width="1.6"/>
    <g fill="none" stroke="#fdba74" stroke-width="1.3">
      <ellipse cx="0" cy="0" rx="8" ry="16"/>
      <line x1="-16" y1="0" x2="16" y2="0"/>
      <path d="M-14,-8 L14,-8 M-14,8 L14,8"/>
    </g>
  </g>
  <text x="634" y="55" fill="#fdba74" font-family="monospace" font-size="11">AllowTunnel</text>

  <!-- ===== host, center ===== -->
  <g transform="translate(500, 110)">
    <rect x="0" y="0" width="200" height="260" rx="22" fill="#0b1220" stroke="#475569" stroke-width="2"/>
    <rect x="10" y="12" width="180" height="236" rx="14" fill="#f4f4fb"/>
    <rect x="20" y="22" width="160" height="56" rx="12" fill="url(#hero)"/>
    <text x="32" y="46" fill="#ffffff" font-family="system-ui" font-weight="700" font-size="14">GameHub</text>
    <text x="32" y="65" fill="#ffffff" opacity="0.85" font-family="monospace" font-size="10">UniversalHub&lt;IGameHub&gt;</text>
    <g font-family="monospace" font-size="10">
      <rect x="20" y="90" width="160" height="148" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="30" y="110" fill="#64748b">Clients.All</text>
      <text x="30" y="132" fill="#1e1b4b">● Allan  <tspan fill="#06b6d4">Ble</tspan></text>
      <text x="30" y="152" fill="#1e1b4b">● Sam    <tspan fill="#059669">Http</tspan></text>
      <text x="30" y="172" fill="#1e1b4b">◌ Jo     <tspan fill="#059669">Http</tspan></text>
      <text x="30" y="198" fill="#7c3aed">StateChanged →</text>
      <text x="30" y="216" fill="#64748b">one hub, both radios</text>
    </g>
  </g>
  <text x="600" y="394" text-anchor="middle" fill="#a78bfa" font-family="system-ui" font-size="13" font-weight="600">UNIVERSAL SERVER</text>

  <!-- ===== left client: BLE ===== -->
  <g transform="translate(90, 120)">
    <rect x="0" y="0" width="160" height="250" rx="24" fill="#0b1220" stroke="#475569" stroke-width="2"/>
    <rect x="60" y="9" width="40" height="7" rx="3.5" fill="#1e293b"/>
    <rect x="9" y="22" width="142" height="218" rx="14" fill="#0b1220" stroke="#1e293b"/>
    <g font-family="monospace" font-size="10">
      <text x="20" y="46" fill="#c084fc">await</text>
      <text x="20" y="62" fill="#e2e8f0">client.Hub</text>
      <text x="26" y="78" fill="#67e8f9">.MakeMove(4);</text>
      <rect x="18" y="100" width="124" height="22" rx="6" fill="url(#chrome)" stroke="#67e8f9"/>
      <text x="80" y="115" text-anchor="middle" fill="#67e8f9">Transport: Ble</text>
      <text x="20" y="150" fill="#64748b">// on a plane,</text>
      <text x="20" y="166" fill="#64748b">// no network</text>
    </g>
  </g>
  <text x="170" y="394" text-anchor="middle" fill="#67e8f9" font-family="system-ui" font-size="13" font-weight="600">BLUETOOTH LE</text>

  <!-- ===== right client: Wi-Fi ===== -->
  <g transform="translate(950, 120)">
    <rect x="0" y="0" width="160" height="250" rx="24" fill="#0b1220" stroke="#475569" stroke-width="2"/>
    <rect x="60" y="9" width="40" height="7" rx="3.5" fill="#1e293b"/>
    <rect x="9" y="22" width="142" height="218" rx="14" fill="#0b1220" stroke="#1e293b"/>
    <g font-family="monospace" font-size="10">
      <text x="20" y="46" fill="#c084fc">await</text>
      <text x="20" y="62" fill="#e2e8f0">client.Hub</text>
      <text x="26" y="78" fill="#67e8f9">.MakeMove(4);</text>
      <rect x="18" y="100" width="124" height="22" rx="6" fill="url(#chrome)" stroke="#34d399"/>
      <text x="80" y="115" text-anchor="middle" fill="#6ee7b7">Transport: Http</text>
      <text x="20" y="150" fill="#64748b">// at home,</text>
      <text x="20" y="166" fill="#64748b">// same code</text>
    </g>
  </g>
  <text x="1030" y="394" text-anchor="middle" fill="#34d399" font-family="system-ui" font-size="13" font-weight="600">WI-FI</text>

  <!-- ===== headline ===== -->
  <g font-family="system-ui" text-anchor="middle">
    <text x="600" y="500" fill="url(#title)" font-size="54" font-weight="800" filter="url(#glow)">Shiny.UniversalHubs</text>
    <text x="600" y="544" fill="#cbd5e1" font-size="20">One hub · Bluetooth LE and Wi-Fi · One discovery list · Resume · Tunnels</text>
    <text x="600" y="580" fill="#94a3b8" font-size="15">BLE Hubs, taken to the next level</text>
  </g>
</svg>

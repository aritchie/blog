<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 830" width="960" height="830" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .band  { font-size: 13px; font-weight: 700; fill: #94a3b8; letter-spacing: 1.6px; }
      .head  { font-size: 17px; font-weight: 700; }
      .sub   { font-size: 13.5px; fill: #475569; }
      .tag   { font-size: 11.5px; font-weight: 700; letter-spacing: .8px; }
      .foot  { font-size: 14px; fill: #94a3b8; }
    </style>
  </defs>

  <rect width="960" height="830" rx="16" fill="#fbfcfe"/>

  <text x="480" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">On-device recognition — one stack per modality</text>

  <!-- band labels (rotated) -->
  <g class="band" text-anchor="middle">
    <text transform="translate(30,134) rotate(-90)">CAPTURE</text>
    <text transform="translate(30,261) rotate(-90)">YOUR CODE</text>
    <text transform="translate(30,388) rotate(-90)">ORCHESTRATE</text>
    <text transform="translate(30,517) rotate(-90)">MODELS</text>
    <text transform="translate(30,653) rotate(-90)">STORE</text>
  </g>
  <line x1="48" y1="80" x2="48" y2="710" stroke="#e2e8f0" stroke-width="2"/>

  <!-- ============ COLUMN 1 : FACE (cyan) ============ -->
  <g>
    <rect x="64" y="96" width="268" height="76" rx="12" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
    <text x="198" y="126" text-anchor="middle" class="head" fill="#0e7490">Shiny CameraView</text>
    <text x="198" y="150" text-anchor="middle" class="sub">live frames · FrameAnalyzer</text>

    <rect x="64" y="216" width="268" height="90" rx="12" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
    <text x="198" y="245" text-anchor="middle" class="head" fill="#0e7490">FaceRecognitionView</text>
    <text x="198" y="269" text-anchor="middle" class="head" fill="#0e7490">FaceEnrollmentView</text>
    <text x="198" y="291" text-anchor="middle" class="sub">two XAML controls, no wiring</text>

    <rect x="64" y="350" width="268" height="76" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="198" y="379" text-anchor="middle" class="head" fill="#0f172a">FaceIntelligenceManager</text>
    <text x="198" y="403" text-anchor="middle" class="sub">detect → embed → nearest</text>

    <rect x="64" y="470" width="268" height="94" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="198" y="495" text-anchor="middle" class="tag" fill="#0891b2">ONNX RUNTIME</text>
    <text x="198" y="519" text-anchor="middle" class="sub">UltraFace RFB-320 · ~1 MB</text>
    <text x="198" y="539" text-anchor="middle" class="sub">ArcFace w600k_mbf · ~13 MB</text>
    <text x="198" y="557" text-anchor="middle" class="sub" font-weight="600">→ 512-d unit vector</text>

    <rect x="64" y="608" width="268" height="90" rx="12" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
    <text x="198" y="637" text-anchor="middle" class="head" fill="#0e7490">faces.db</text>
    <text x="198" y="659" text-anchor="middle" class="sub">DocumentDb + sqlite-vec</text>
    <text x="198" y="679" text-anchor="middle" class="sub">cosine kNN, threshold 0.6</text>
  </g>

  <!-- ============ COLUMN 2 : VOICE (violet) ============ -->
  <g>
    <rect x="362" y="96" width="268" height="76" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
    <text x="496" y="126" text-anchor="middle" class="head" fill="#6d28d9">Microphone</text>
    <text x="496" y="150" text-anchor="middle" class="sub">IVoiceRecorder → 16 kHz mono float[]</text>

    <rect x="362" y="216" width="268" height="90" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <text x="496" y="245" text-anchor="middle" class="head" fill="#6d28d9">IVoiceIntelligence</text>
    <text x="496" y="269" text-anchor="middle" class="head" fill="#6d28d9">VoiceEnrollmentView</text>
    <text x="496" y="291" text-anchor="middle" class="sub">or drive the session directly</text>

    <rect x="362" y="350" width="268" height="76" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="496" y="379" text-anchor="middle" class="head" fill="#0f172a">VoiceIntelligenceManager</text>
    <text x="496" y="403" text-anchor="middle" class="sub">gate → embed → nearest</text>

    <rect x="362" y="470" width="268" height="94" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="496" y="495" text-anchor="middle" class="tag" fill="#7c3aed">ONNX RUNTIME</text>
    <text x="496" y="519" text-anchor="middle" class="sub">KaldiFbank · 80-bin filterbank</text>
    <text x="496" y="539" text-anchor="middle" class="sub">CAM++ / ECAPA-TDNN</text>
    <text x="496" y="557" text-anchor="middle" class="sub" font-weight="600">→ 512-d unit vector</text>

    <rect x="362" y="608" width="268" height="90" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
    <text x="496" y="637" text-anchor="middle" class="head" fill="#6d28d9">voices.db</text>
    <text x="496" y="659" text-anchor="middle" class="sub">DocumentDb + sqlite-vec</text>
    <text x="496" y="679" text-anchor="middle" class="sub">cosine kNN, threshold 0.40</text>
  </g>

  <!-- ============ COLUMN 3 : DOCUMENTS (green) ============ -->
  <g>
    <rect x="660" y="96" width="268" height="76" rx="12" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
    <text x="794" y="126" text-anchor="middle" class="head" fill="#047857">Native scanner</text>
    <text x="794" y="150" text-anchor="middle" class="sub">VisionKit · ML Kit · Vision</text>

    <rect x="660" y="216" width="268" height="90" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2"/>
    <text x="794" y="245" text-anchor="middle" class="head" fill="#047857">IDocumentScanner</text>
    <text x="794" y="269" text-anchor="middle" class="head" fill="#047857">IDocumentExtractor</text>
    <text x="794" y="291" text-anchor="middle" class="sub">modal capture, then extract</text>

    <rect x="660" y="350" width="268" height="76" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="794" y="379" text-anchor="middle" class="head" fill="#0f172a">DocumentExtractor</text>
    <text x="794" y="403" text-anchor="middle" class="sub">recognize → parse → record</text>

    <rect x="660" y="470" width="268" height="94" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="794" y="495" text-anchor="middle" class="tag" fill="#059669">PLATFORM ML</text>
    <text x="794" y="519" text-anchor="middle" class="sub">OCR · PDF417 · MRZ · Luhn</text>
    <text x="794" y="539" text-anchor="middle" class="sub">NSDataDetector enrichment</text>
    <text x="794" y="557" text-anchor="middle" class="sub" font-weight="600">→ typed records</text>

    <rect x="660" y="608" width="268" height="90" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="794" y="645" text-anchor="middle" class="head" fill="#64748b">no store</text>
    <text x="794" y="669" text-anchor="middle" class="sub">Receipt · Invoice · Passport…</text>
  </g>

  <!-- arrows -->
  <g stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)">
    <line x1="198" y1="172" x2="198" y2="212"/><line x1="496" y1="172" x2="496" y2="212"/><line x1="794" y1="172" x2="794" y2="212"/>
    <line x1="198" y1="306" x2="198" y2="346"/><line x1="496" y1="306" x2="496" y2="346"/><line x1="794" y1="306" x2="794" y2="346"/>
    <line x1="198" y1="426" x2="198" y2="466"/><line x1="496" y1="426" x2="496" y2="466"/><line x1="794" y1="426" x2="794" y2="466"/>
    <line x1="198" y1="564" x2="198" y2="604"/><line x1="496" y1="564" x2="496" y2="604"/><line x1="794" y1="564" x2="794" y2="604"/>
  </g>

  <!-- footer -->
  <rect x="64" y="738" width="864" height="64" rx="12" fill="#0f172a"/>
  <text x="496" y="765" text-anchor="middle" font-size="15.5" font-weight="700" fill="#e2e8f0">Everything above runs on the device.</text>
  <text x="496" y="787" text-anchor="middle" class="foot" fill="#94a3b8">No inference calls, no uploads — no image, audio or document ever leaves the phone.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="trackA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="trackB" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="netGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#06b6d4" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.3" opacity="0.3"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <ellipse cx="600" cy="240" rx="560" ry="240" fill="url(#netGlow)"/>

  <!-- ===== the timeline panel ===== -->
  <g transform="translate(150, 40)">
    <rect x="0" y="0" width="900" height="196" rx="14" fill="url(#chrome)" stroke="#334155" stroke-width="1.5"/>
    <path d="M0,14 a14,14 0 0 1 14,-14 h872 a14,14 0 0 1 14,14 v22 h-900 z" fill="#0b1220"/>
    <circle cx="20" cy="18" r="4.5" fill="#ef4444" opacity="0.75"/>
    <circle cx="36" cy="18" r="4.5" fill="#f59e0b" opacity="0.75"/>
    <circle cx="52" cy="18" r="4.5" fill="#10b981" opacity="0.75"/>
    <text x="76" y="22" fill="#64748b" font-family="system-ui" font-size="11">Keyframes  Duration="0:0:1.2"  Direction="Alternate"  Fill="Both"</text>
    <line x1="0" y1="36" x2="900" y2="36" stroke="#334155" stroke-width="1"/>

    <!-- offset ruler -->
    <g font-family="monospace" font-size="9" fill="#475569">
      <text x="150" y="56">0.0</text>
      <text x="330" y="56">0.25</text>
      <text x="510" y="56">0.5</text>
      <text x="690" y="56">0.75</text>
      <text x="850" y="56">1.0</text>
    </g>

    <!-- track 1 : Scale -->
    <text x="24" y="90" fill="#94a3b8" font-family="monospace" font-size="12">Scale</text>
    <line x1="156" y1="86" x2="864" y2="86" stroke="#1f2937" stroke-width="6" stroke-linecap="round"/>
    <line x1="156" y1="86" x2="864" y2="86" stroke="url(#trackA)" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>
    <g fill="#0b1220" stroke="#22d3ee" stroke-width="2">
      <rect x="150" y="80" width="12" height="12" transform="rotate(45 156 86)"/>
    </g>
    <g fill="#0b1220" stroke="#a78bfa" stroke-width="2">
      <rect x="504" y="80" width="12" height="12" transform="rotate(45 510 86)"/>
    </g>
    <g fill="#0b1220" stroke="#8b5cf6" stroke-width="2">
      <rect x="858" y="80" width="12" height="12" transform="rotate(45 864 86)"/>
    </g>

    <!-- track 2 : BackgroundColor -->
    <text x="24" y="132" fill="#94a3b8" font-family="monospace" font-size="12">BackgroundColor</text>
    <line x1="156" y1="128" x2="864" y2="128" stroke="#1f2937" stroke-width="6" stroke-linecap="round"/>
    <line x1="156" y1="128" x2="864" y2="128" stroke="url(#trackB)" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>
    <g fill="#0b1220" stroke="#34d399" stroke-width="2">
      <rect x="150" y="122" width="12" height="12" transform="rotate(45 156 128)"/>
    </g>
    <g fill="#0b1220" stroke="#f472b6" stroke-width="2">
      <rect x="858" y="122" width="12" height="12" transform="rotate(45 864 128)"/>
    </g>

    <!-- playhead -->
    <g filter="url(#glow)">
      <line x1="600" y1="46" x2="600" y2="152" stroke="#fbbf24" stroke-width="1.6"/>
      <circle cx="600" cy="46" r="4.5" fill="#fbbf24"/>
    </g>
    <text x="612" y="50" fill="#fbbf24" font-family="monospace" font-size="10">SeekProgress(0.62)</text>

    <!-- easing readout -->
    <line x1="0" y1="160" x2="900" y2="160" stroke="#334155" stroke-width="1"/>
    <path d="M24,188 C90,188 96,170 156,170" fill="none" stroke="#67e8f9" stroke-width="1.6"/>
    <text x="172" y="185" fill="#64748b" font-family="monospace" font-size="11">cubic-bezier(0.34, 1.56, 0.64, 1)  ·  spring(0.35, 14)  ·  steps(8)  ·  38 named curves</text>
  </g>

  <!-- ===== one spec, two engines ===== -->
  <g stroke="#a78bfa" stroke-width="1.3" fill="none" opacity="0.45">
    <path d="M600,236 L600,258"/>
    <path d="M600,258 L330,258 L330,282"/>
    <path d="M600,258 L870,258 L870,282"/>
  </g>

  <g font-family="system-ui" text-anchor="middle">
    <g>
      <rect x="176" y="282" width="308" height="66" rx="12" fill="#0b1220" stroke="#06b6d4" stroke-width="1.3"/>
      <text x="330" y="306" fill="#e2e8f0" font-size="14" font-weight="600">.NET MAUI</text>
      <text x="330" y="325" fill="#22d3ee" font-size="11" font-family="monospace">KeyframeScene on a GraphicsView</text>
      <text x="330" y="340" fill="#64748b" font-size="10">evaluated per frame · one clock per window</text>
    </g>
    <g>
      <rect x="716" y="282" width="308" height="66" rx="12" fill="#0b1220" stroke="#8b5cf6" stroke-width="1.3"/>
      <text x="870" y="306" fill="#e2e8f0" font-size="14" font-weight="600">Blazor</text>
      <text x="870" y="325" fill="#a78bfa" font-size="11" font-family="monospace">compiled to CSS @keyframes</text>
      <text x="870" y="340" fill="#64748b" font-size="10">the compositor runs it · zero C# per frame</text>
    </g>
    <text x="600" y="322" fill="#94a3b8" font-size="12" font-weight="600">one spec</text>
    <text x="600" y="340" fill="#64748b" font-size="10">42 icons</text>
  </g>

  <!-- ===== the button ===== -->
  <g transform="translate(454, 372)">
    <rect x="0" y="0" width="292" height="46" rx="12" fill="#6d28d9" stroke="#a78bfa" stroke-width="1.2" filter="url(#glow)"/>
    <g stroke="#ede9fe" stroke-width="2.4" fill="none" stroke-linecap="round">
      <path d="M26,23 a10,10 0 1 1 7,9.5"/>
    </g>
    <text x="60" y="28" fill="#f5f3ff" font-family="system-ui" font-size="15" font-weight="600">Saving...</text>
  </g>
  <text x="600" y="442" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="11">Command="{Binding SaveCommand}" · no IsBusy anywhere · Busy → Success → Normal, on its own</text>

  <!-- ===== title ===== -->
  <text x="600" y="506" text-anchor="middle" fill="#f1f5f9" font-family="system-ui" font-size="50" font-weight="bold" filter="url(#softGlow)">Keyframes, Motion Icons &amp; ShinyButton</text>
  <text x="600" y="548" text-anchor="middle" fill="#a78bfa" font-family="system-ui" font-size="24" font-weight="600">animation that seeks, reverses and exports</text>
  <text x="600" y="582" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="15">.NET MAUI &amp; Blazor · a pure function of time</text>

  <circle cx="56" cy="72" r="3" fill="#a78bfa" opacity="0.5"/>
  <circle cx="80" cy="52" r="2" fill="#22d3ee" opacity="0.4"/>
  <circle cx="44" cy="466" r="2.5" fill="#34d399" opacity="0.4"/>
  <circle cx="1148" cy="72" r="3" fill="#22d3ee" opacity="0.5"/>
  <circle cx="1124" cy="52" r="2" fill="#a78bfa" opacity="0.4"/>
  <circle cx="1156" cy="466" r="2.5" fill="#a78bfa" opacity="0.4"/>
</svg>

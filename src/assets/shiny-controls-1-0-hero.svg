<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="accentB" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="accentC" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="netGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#06b6d4" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="phoneClip"><rect x="742" y="118" width="180" height="394" rx="26"/></clipPath>
    <clipPath id="paneClip"><rect x="946" y="150" width="196" height="330" rx="16"/></clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="900" cy="300" rx="520" ry="420" fill="url(#netGlow)"/>

  <!-- faint token grid -->
  <g stroke="#334155" stroke-opacity="0.28" stroke-width="1">
    <path d="M0 150 H1200 M0 300 H1200 M0 450 H1200"/>
    <path d="M150 0 V630 M300 0 V630 M450 0 V630 M600 0 V630 M750 0 V630 M900 0 V630 M1050 0 V630"/>
  </g>

  <!-- ============ headline ============ -->
  <text x="72" y="214" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#22d3ee" letter-spacing="4.5">SHINY CONTROLS</text>

  <text x="72" y="316" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="96" font-weight="800" fill="#f8fafc">1.0</text>
  <text x="238" y="316" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#e2e8f0">The Ultra</text>
  <text x="72" y="384" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#e2e8f0">Control Suite</text>

  <rect x="72" y="416" width="132" height="5" rx="2.5" fill="url(#accentA)" filter="url(#glow)"/>

  <text x="72" y="472" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="27" font-weight="500" fill="#94a3b8">.NET MAUI &amp; Blazor</text>
  <text x="72" y="512" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#64748b">One token contract · two renderers · zero WebViews</text>

  <!-- ============ phone: chat bubbles ============ -->
  <g filter="url(#softGlow)">
    <rect x="742" y="118" width="180" height="394" rx="26" fill="url(#chrome)" stroke="#475569" stroke-width="1.5"/>
  </g>
  <g clip-path="url(#phoneClip)">
    <rect x="742" y="118" width="180" height="42" fill="#0b1220"/>
    <rect x="806" y="130" width="52" height="9" rx="4.5" fill="#1e293b"/>

    <!-- incoming -->
    <circle cx="762" cy="196" r="11" fill="#334155"/>
    <rect x="780" y="180" width="96" height="34" rx="12" fill="#1e293b"/>
    <rect x="790" y="190" width="62" height="5" rx="2.5" fill="#64748b"/>
    <rect x="790" y="201" width="44" height="5" rx="2.5" fill="#475569"/>

    <!-- outgoing -->
    <rect x="812" y="228" width="94" height="42" rx="12" fill="url(#accentB)" opacity="0.92"/>
    <rect x="822" y="240" width="66" height="5" rx="2.5" fill="#0f172a" opacity="0.55"/>
    <rect x="822" y="252" width="48" height="5" rx="2.5" fill="#0f172a" opacity="0.4"/>

    <!-- incoming w/ reaction -->
    <circle cx="762" cy="300" r="11" fill="#334155"/>
    <rect x="780" y="284" width="110" height="46" rx="12" fill="#1e293b"/>
    <rect x="790" y="294" width="80" height="5" rx="2.5" fill="#64748b"/>
    <rect x="790" y="306" width="58" height="5" rx="2.5" fill="#475569"/>
    <rect x="790" y="318" width="34" height="5" rx="2.5" fill="#475569"/>
    <circle cx="884" cy="332" r="9" fill="#0b1220" stroke="#f472b6" stroke-width="1.5"/>
    <circle cx="884" cy="332" r="3.4" fill="#f472b6"/>

    <!-- typing dots -->
    <rect x="780" y="348" width="52" height="24" rx="11" fill="#1e293b"/>
    <circle cx="794" cy="360" r="3.2" fill="#64748b"/>
    <circle cx="806" cy="360" r="3.2" fill="#94a3b8"/>
    <circle cx="818" cy="360" r="3.2" fill="#64748b"/>

    <!-- composer -->
    <rect x="754" y="462" width="122" height="30" rx="15" fill="#0b1220" stroke="#334155" stroke-width="1"/>
    <rect x="766" y="475" width="56" height="5" rx="2.5" fill="#475569"/>
    <circle cx="898" cy="477" r="16" fill="url(#accentA)"/>
    <path d="M891 477 L905 477 M899 471 L905 477 L899 483" stroke="#0f172a" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- walkthrough spotlight over the phone -->
  <circle cx="864" cy="249" r="46" fill="none" stroke="#7dd3fc" stroke-width="2.5" opacity="0.95" filter="url(#glow)"/>
  <circle cx="864" cy="249" r="58" fill="none" stroke="#7dd3fc" stroke-width="1" opacity="0.35"/>

  <!-- ============ right pane: calendar + tokens ============ -->
  <g filter="url(#softGlow)">
    <rect x="946" y="150" width="196" height="330" rx="16" fill="url(#chrome)" stroke="#475569" stroke-width="1.5"/>
  </g>
  <g clip-path="url(#paneClip)">
    <rect x="946" y="150" width="196" height="34" fill="#0b1220"/>
    <rect x="962" y="163" width="58" height="7" rx="3.5" fill="#475569"/>

    <!-- calendar grid -->
    <g fill="#1e293b">
      <rect x="962" y="200" width="24" height="22" rx="5"/><rect x="992" y="200" width="24" height="22" rx="5"/>
      <rect x="1022" y="200" width="24" height="22" rx="5"/><rect x="1052" y="200" width="24" height="22" rx="5"/>
      <rect x="1082" y="200" width="24" height="22" rx="5"/><rect x="1112" y="200" width="14" height="22" rx="5"/>
      <rect x="962" y="228" width="24" height="22" rx="5"/><rect x="992" y="228" width="24" height="22" rx="5"/>
      <rect x="1052" y="228" width="24" height="22" rx="5"/>
      <rect x="1082" y="228" width="24" height="22" rx="5"/><rect x="1112" y="228" width="14" height="22" rx="5"/>
      <rect x="962" y="256" width="24" height="22" rx="5"/>
      <rect x="1022" y="256" width="24" height="22" rx="5"/><rect x="1052" y="256" width="24" height="22" rx="5"/>
      <rect x="1082" y="256" width="24" height="22" rx="5"/><rect x="1112" y="256" width="14" height="22" rx="5"/>
    </g>
    <rect x="1022" y="228" width="24" height="22" rx="5" fill="url(#accentA)"/>
    <rect x="992" y="256" width="24" height="22" rx="5" fill="url(#accentC)" opacity="0.85"/>
    <!-- a multi-day event spanning cells -->
    <rect x="964" y="286" width="112" height="10" rx="5" fill="url(#accentB)" opacity="0.9"/>
    <rect x="1080" y="286" width="46" height="10" rx="5" fill="url(#accentB)" opacity="0.45"/>

    <!-- token swatch row -->
    <rect x="962" y="322" width="164" height="1" fill="#334155"/>
    <g>
      <rect x="962" y="340" width="36" height="26" rx="7" fill="#3b82f6"/>
      <rect x="1004" y="340" width="36" height="26" rx="7" fill="#22d3ee"/>
      <rect x="1046" y="340" width="36" height="26" rx="7" fill="#a78bfa"/>
      <rect x="1088" y="340" width="36" height="26" rx="7" fill="#34d399"/>
      <rect x="962" y="374" width="36" height="26" rx="7" fill="#f472b6"/>
      <rect x="1004" y="374" width="36" height="26" rx="7" fill="#fbbf24"/>
      <rect x="1046" y="374" width="36" height="26" rx="7" fill="#ef4444"/>
      <rect x="1088" y="374" width="36" height="26" rx="7" fill="#334155"/>
    </g>

    <!-- button + progress -->
    <rect x="962" y="418" width="86" height="28" rx="14" fill="url(#accentA)"/>
    <rect x="982" y="430" width="46" height="5" rx="2.5" fill="#0f172a" opacity="0.5"/>
    <rect x="1058" y="428" width="68" height="8" rx="4" fill="#1e293b"/>
    <rect x="1058" y="428" width="42" height="8" rx="4" fill="url(#accentB)"/>
  </g>

  <!-- connector accents -->
  <g opacity="0.6">
    <path d="M922 300 H946" stroke="url(#accentA)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="922" cy="300" r="3.4" fill="#22d3ee"/>
    <circle cx="946" cy="300" r="3.4" fill="#8b5cf6"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="hero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="glowL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.32"/>
    </radialGradient>
    <radialGradient id="glowR" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.24"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.3" opacity="0.3"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <ellipse cx="250" cy="270" rx="280" ry="250" fill="url(#glowL)"/>
  <ellipse cx="950" cy="270" rx="280" ry="250" fill="url(#glowR)"/>

  <!-- ===== host phone, left ===== -->
  <g transform="translate(130, 50)">
    <rect x="0" y="0" width="200" height="370" rx="30" fill="#0b1220" stroke="#475569" stroke-width="2"/>
    <rect x="77" y="10" width="46" height="8" rx="4" fill="#1e293b"/>
    <rect x="10" y="26" width="180" height="334" rx="18" fill="#f4f4fb"/>
    <rect x="20" y="38" width="160" height="56" rx="12" fill="url(#hero)"/>
    <text x="32" y="62" fill="#ffffff" font-family="system-ui" font-weight="700" font-size="14">GameHub</text>
    <text x="32" y="81" fill="#ffffff" opacity="0.85" font-family="monospace" font-size="10">BleHub&lt;IGameHub&gt;</text>
    <!-- board -->
    <g transform="translate(40, 110)" stroke="#1e1b4b" stroke-width="3" stroke-linecap="round">
      <line x1="40" y1="0" x2="40" y2="120"/>
      <line x1="80" y1="0" x2="80" y2="120"/>
      <line x1="0" y1="40" x2="120" y2="40"/>
      <line x1="0" y1="80" x2="120" y2="80"/>
      <g stroke="#7c3aed" stroke-width="4">
        <line x1="10" y1="10" x2="30" y2="30"/><line x1="30" y1="10" x2="10" y2="30"/>
        <line x1="50" y1="50" x2="70" y2="70"/><line x1="70" y1="50" x2="50" y2="70"/>
      </g>
      <g stroke="#06b6d4" stroke-width="4" fill="none">
        <circle cx="100" cy="20" r="11"/>
        <circle cx="20" cy="100" r="11"/>
      </g>
    </g>
    <g font-family="monospace" font-size="10">
      <rect x="20" y="248" width="160" height="96" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="30" y="268" fill="#64748b">Clients</text>
      <text x="30" y="288" fill="#1e1b4b">● Allan   <tspan fill="#7c3aed">X</tspan></text>
      <text x="30" y="306" fill="#1e1b4b">● Sam     <tspan fill="#06b6d4">O</tspan></text>
      <text x="30" y="324" fill="#1e1b4b">◌ Jo      <tspan fill="#94a3b8">spectators</tspan></text>
    </g>
  </g>
  <text x="230" y="446" text-anchor="middle" fill="#a78bfa" font-family="system-ui" font-size="13" font-weight="600">HOST</text>

  <!-- ===== client phone, right ===== -->
  <g transform="translate(870, 50)">
    <rect x="0" y="0" width="200" height="370" rx="30" fill="#0b1220" stroke="#475569" stroke-width="2"/>
    <rect x="77" y="10" width="46" height="8" rx="4" fill="#1e293b"/>
    <rect x="10" y="26" width="180" height="334" rx="18" fill="#f4f4fb"/>
    <rect x="20" y="38" width="160" height="56" rx="12" fill="url(#hero)"/>
    <text x="32" y="62" fill="#ffffff" font-family="system-ui" font-weight="700" font-size="14">GameHubClient</text>
    <text x="32" y="81" fill="#ffffff" opacity="0.85" font-family="monospace" font-size="10">generated proxy</text>
    <g font-family="monospace" font-size="10">
      <rect x="20" y="108" width="160" height="236" rx="8" fill="#0b1220"/>
      <text x="30" y="130" fill="#c084fc">await</text>
      <text x="30" y="146" fill="#e2e8f0">client.Hub</text>
      <text x="38" y="162" fill="#67e8f9">.MakeMove(4);</text>
      <text x="30" y="190" fill="#e2e8f0">client.Hub</text>
      <text x="38" y="206" fill="#34d399">.StateChanged</text>
      <text x="46" y="222" fill="#e2e8f0">+= Apply;</text>
      <text x="30" y="250" fill="#c084fc">await foreach</text>
      <text x="38" y="266" fill="#e2e8f0">(n in client.Hub</text>
      <text x="38" y="282" fill="#67e8f9">.Countdown(10))</text>
      <text x="30" y="310" fill="#64748b">// no bytes, no MTU,</text>
      <text x="30" y="326" fill="#64748b">// no frame parser</text>
    </g>
  </g>
  <text x="970" y="446" text-anchor="middle" fill="#67e8f9" font-family="system-ui" font-size="13" font-weight="600">CLIENT</text>

  <!-- ===== the radio between them ===== -->
  <!-- bluetooth mark -->
  <g transform="translate(600, 72)" filter="url(#softGlow)">
    <circle cx="0" cy="0" r="30" fill="#1e293b" stroke="url(#hero)" stroke-width="2"/>
    <path d="M-9,-10 L9,8 L0,17 L0,-17 L9,-8 L-9,10" fill="none" stroke="#67e8f9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g fill="none" stroke="#67e8f9" stroke-width="1.4" opacity="0.45">
    <path d="M556,40 A60,60 0 0 0 556,104"/>
    <path d="M644,40 A60,60 0 0 1 644,104"/>
    <path d="M540,28 A80,80 0 0 0 540,116" opacity="0.6"/>
    <path d="M660,28 A80,80 0 0 1 660,116" opacity="0.6"/>
  </g>

  <!-- calls: client -> host (Invoke frames) -->
  <g font-family="monospace" font-size="11">
    <g fill="none" stroke="#67e8f9" stroke-width="1.6" stroke-dasharray="5 6" opacity="0.85">
      <path d="M860,175 C760,160 440,160 340,175"/>
    </g>
    <polygon points="344,169 344,181 334,175" fill="#67e8f9"/>
    <g transform="translate(470, 145)">
      <rect x="0" y="0" width="56" height="20" rx="4" fill="url(#chrome)" stroke="#67e8f9"/>
      <text x="28" y="14" text-anchor="middle" fill="#67e8f9">#7 1/2</text>
      <rect x="66" y="0" width="56" height="20" rx="4" fill="url(#chrome)" stroke="#67e8f9"/>
      <text x="94" y="14" text-anchor="middle" fill="#67e8f9">#7 2/2</text>
      <rect x="132" y="0" width="128" height="20" rx="4" fill="url(#chrome)" stroke="#475569"/>
      <text x="196" y="14" text-anchor="middle" fill="#e2e8f0">Invoke MakeMove</text>
    </g>

    <!-- replies: host -> client (Completion, correlated) -->
    <g fill="none" stroke="#a78bfa" stroke-width="1.6" stroke-dasharray="5 6" opacity="0.85">
      <path d="M340,245 C440,260 760,260 860,245"/>
    </g>
    <polygon points="856,239 856,251 866,245" fill="#a78bfa"/>
    <g transform="translate(440, 228)">
      <rect x="0" y="0" width="150" height="20" rx="4" fill="url(#chrome)" stroke="#a78bfa"/>
      <text x="75" y="14" text-anchor="middle" fill="#c4b5fd">Completion #7</text>
      <rect x="160" y="0" width="160" height="20" rx="4" fill="url(#chrome)" stroke="#475569"/>
      <text x="240" y="14" text-anchor="middle" fill="#e2e8f0">{"accepted":true}</text>
    </g>

    <!-- pushes: host -> all clients -->
    <g fill="none" stroke="#34d399" stroke-width="1.6" stroke-dasharray="5 6" opacity="0.85">
      <path d="M340,320 C440,340 760,340 860,320"/>
    </g>
    <polygon points="856,314 856,326 866,320" fill="#34d399"/>
    <g transform="translate(410, 306)">
      <rect x="0" y="0" width="190" height="20" rx="4" fill="url(#chrome)" stroke="#34d399"/>
      <text x="95" y="14" text-anchor="middle" fill="#6ee7b7">Push StateChanged</text>
      <rect x="200" y="0" width="180" height="20" rx="4" fill="url(#chrome)" stroke="#475569"/>
      <text x="290" y="14" text-anchor="middle" fill="#e2e8f0">Clients.All · in order</text>
    </g>

    <!-- L2CAP -->
    <g fill="none" stroke="#fb923c" stroke-width="3" opacity="0.7">
      <path d="M340,395 L860,395"/>
    </g>
    <polygon points="856,388 856,402 868,395" fill="#fb923c"/>
    <text x="600" y="385" text-anchor="middle" fill="#fdba74" font-family="system-ui" font-size="12">avatar.jpg · L2CAP</text>
  </g>

  <!-- ===== headline ===== -->
  <g font-family="system-ui" text-anchor="middle">
    <text x="600" y="536" fill="url(#title)" font-size="50" font-weight="800" filter="url(#glow)">Shiny.BluetoothLE.Hubs</text>
    <text x="600" y="576" fill="#cbd5e1" font-size="19">SignalR-style hubs over Bluetooth LE · Calls · Streams · Events · Groups · JSON</text>
  </g>
</svg>

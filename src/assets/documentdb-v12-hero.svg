  <!-- v12 badge -->
  <g filter="url(#glow)">
    <rect x="828" y="86" width="66" height="30" rx="15" fill="#8b5cf6" fill-opacity="0.18" stroke="#a78bfa" stroke-width="1.4"/>
    <text x="861" y="106" text-anchor="middle" fill="#c4b5fd" font-family="system-ui" font-size="14" font-weight="bold">v12</text>

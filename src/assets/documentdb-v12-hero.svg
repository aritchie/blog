      <rect x="196" y="108" width="40" height="6" rx="3"/>
      <rect x="276" y="108" width="70" height="6" rx="3"/>
      <rect x="364" y="108" width="30" height="6" rx="3" fill="#34d399" opacity="0.7"/>

    <!-- expanded json row -->
    <rect x="134" y="188" width="352" height="122" rx="8" fill="#0b1220" stroke="#334155" stroke-width="1"/>
    <text x="146" y="206" fill="#a78bfa" font-family="monospace" font-size="10">{</text>
    <text x="160" y="222" fill="#f472b6" font-family="monospace" font-size="10">"number"</text>
    <text x="222" y="222" fill="#64748b" font-family="monospace" font-size="10">:</text>
    <text x="232" y="222" fill="#34d399" font-family="monospace" font-size="10">"SO-4205"</text>
    <text x="160" y="238" fill="#f472b6" font-family="monospace" font-size="10">"customer"</text>
    <text x="234" y="238" fill="#64748b" font-family="monospace" font-size="10">: {</text>
    <text x="174" y="254" fill="#f472b6" font-family="monospace" font-size="10">"tier"</text>
    <text x="216" y="254" fill="#64748b" font-family="monospace" font-size="10">:</text>
    <text x="226" y="254" fill="#34d399" font-family="monospace" font-size="10">"gold"</text>
    <text x="160" y="270" fill="#64748b" font-family="monospace" font-size="10">},</text>
    <text x="160" y="286" fill="#f472b6" font-family="monospace" font-size="10">"total"</text>
    <text x="210" y="286" fill="#64748b" font-family="monospace" font-size="10">:</text>
    <text x="220" y="286" fill="#22d3ee" font-family="monospace" font-size="10">853.15</text>
    <text x="146" y="302" fill="#a78bfa" font-family="monospace" font-size="10">}</text>
  </g>


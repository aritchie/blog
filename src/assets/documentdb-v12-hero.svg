  <!-- ===== title ===== -->
  <text x="600" y="500" text-anchor="middle" fill="#f1f5f9" font-family="system-ui" font-size="52" font-weight="bold" filter="url(#softGlow)">Shiny.DocumentDb</text>
  <text x="600" y="548" text-anchor="middle" fill="#22d3ee" font-family="system-ui" font-size="27" font-weight="600">Doing All The Things</text>
  <text x="600" y="584" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="15">an admin UI · schema-free collections · soft delete · trim-clean</text>

  <!-- decorative dots -->

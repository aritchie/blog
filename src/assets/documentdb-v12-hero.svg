    <rect x="196" y="84" width="52" height="6" rx="3" fill="#64748b"/>
    <rect x="276" y="84" width="60" height="6" rx="3" fill="#64748b"/>
    <rect x="364" y="84" width="40" height="6" rx="3" fill="#64748b"/>
    <rect x="432" y="84" width="44" height="6" rx="3" fill="#64748b"/>

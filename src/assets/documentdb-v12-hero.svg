<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="accentViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="netGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.3" opacity="0.3"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <ellipse cx="600" cy="290" rx="520" ry="290" fill="url(#netGlow)"/>

  <!-- ===== admin UI browser window (centre) ===== -->
  <g transform="translate(340, 96)">
    <rect x="0" y="0" width="520" height="330" rx="14" fill="url(#chrome)" stroke="#334155" stroke-width="1.5"/>
    <!-- title bar -->
    <path d="M0,14 a14,14 0 0 1 14,-14 h492 a14,14 0 0 1 14,14 v22 h-520 z" fill="#0b1220"/>
    <circle cx="20" cy="18" r="4.5" fill="#ef4444" opacity="0.75"/>
    <circle cx="36" cy="18" r="4.5" fill="#f59e0b" opacity="0.75"/>
    <circle cx="52" cy="18" r="4.5" fill="#10b981" opacity="0.75"/>
    <text x="76" y="22" fill="#64748b" font-family="system-ui" font-size="11">ShinyDocDbMyAdmin</text>
    <line x1="0" y1="36" x2="520" y2="36" stroke="#334155" stroke-width="1"/>

    <!-- sidebar -->
    <rect x="0" y="36" width="118" height="294" fill="#0b1220"/>
    <line x1="118" y1="36" x2="118" y2="330" stroke="#334155" stroke-width="1"/>
    <text x="14" y="60" fill="#475569" font-family="system-ui" font-size="8" letter-spacing="1">CONNECTIONS</text>
    <rect x="12" y="70" width="76" height="7" rx="3.5" fill="#22d3ee" opacity="0.65"/>
    <rect x="22" y="88" width="60" height="6" rx="3" fill="#475569"/>

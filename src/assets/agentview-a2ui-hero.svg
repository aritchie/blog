<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="860" cy="320" rx="480" ry="400" fill="url(#glow)"/>
  <g stroke="#334155" stroke-opacity="0.28" stroke-width="1">
    <path d="M0 150 H1200 M0 300 H1200 M0 450 H1200"/>
    <path d="M150 0 V630 M300 0 V630 M450 0 V630 M600 0 V630 M750 0 V630 M900 0 V630 M1050 0 V630"/>
  </g>

  <!-- title -->
  <text x="70" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#f8fafc">AgentView</text>
  <text x="70" y="275" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="url(#accent)">+ A2UI</text>
  <text x="72" y="335" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#cbd5e1">Agents that answer with real controls</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="600">
    <rect x="72" y="380" width="150" height="40" rx="20" fill="#512bd4"/>
    <text x="147" y="406" text-anchor="middle" fill="#fff">.NET MAUI</text>
    <rect x="236" y="380" width="120" height="40" rx="20" fill="#7c3aed"/>
    <text x="296" y="406" text-anchor="middle" fill="#fff">Blazor</text>
    <rect x="370" y="380" width="112" height="40" rx="20" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <text x="426" y="406" text-anchor="middle" fill="#22d3ee">AG-UI</text>
  </g>

  <!-- conversation window -->
  <rect x="640" y="70" width="490" height="490" rx="22" fill="url(#panel)" stroke="#334155" stroke-width="2"/>
  <circle cx="670" cy="98" r="6" fill="#ef4444"/><circle cx="690" cy="98" r="6" fill="#f59e0b"/><circle cx="710" cy="98" r="6" fill="#22c55e"/>

  <!-- user bubble -->
  <rect x="860" y="128" width="240" height="44" rx="16" fill="#512bd4"/>
  <text x="980" y="157" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#fff">Show me October sales</text>

  <!-- tool card -->
  <rect x="670" y="190" width="300" height="36" rx="10" fill="#0f172a" stroke="#334155"/>
  <text x="688" y="214" font-family="Menlo, Consolas, monospace" font-size="15" fill="#94a3b8">render_ui</text>
  <text x="950" y="214" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#22c55e">✓</text>

  <!-- surface: gauge + grid -->
  <rect x="670" y="242" width="430" height="290" rx="14" fill="#0b1222" stroke="url(#accent)" stroke-width="2"/>
  <text x="692" y="276" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">October sales</text>
  <rect x="1010" y="258" width="70" height="26" rx="13" fill="#14532d"/>
  <text x="1045" y="276" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#86efac">Live</text>

  <!-- gauge -->
  <g transform="translate(770 380)" fill="none" stroke-width="14" stroke-linecap="round">
    <path d="M-70 0 A70 70 0 0 1 -21.6 -66.6" stroke="#ef4444"/>
    <path d="M-21.6 -66.6 A70 70 0 0 1 56.6 -41.1" stroke="#f59e0b"/>
    <path d="M56.6 -41.1 A70 70 0 0 1 70 0" stroke="#22c55e"/>
    <line x1="0" y1="0" x2="30" y2="-58" stroke="#f8fafc" stroke-width="4"/>
    <circle cx="0" cy="0" r="6" fill="#f8fafc" stroke="none"/>
  </g>
  <text x="770" y="420" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">72%</text>

  <!-- grid -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
    <rect x="870" y="300" width="210" height="28" fill="#1e293b"/>
    <text x="880" y="319" fill="#94a3b8" font-weight="600">Customer</text>
    <text x="1070" y="319" text-anchor="end" fill="#94a3b8" font-weight="600">Total</text>
    <text x="880" y="350" fill="#e2e8f0">Northwind</text><text x="1070" y="350" text-anchor="end" fill="#e2e8f0">€1,250.50</text>
    <line x1="870" y1="360" x2="1080" y2="360" stroke="#1e293b"/>
    <text x="880" y="382" fill="#e2e8f0">Contoso</text><text x="1070" y="382" text-anchor="end" fill="#e2e8f0">€980.00</text>
    <line x1="870" y1="392" x2="1080" y2="392" stroke="#1e293b"/>
    <text x="880" y="414" fill="#e2e8f0">Fabrikam</text><text x="1070" y="414" text-anchor="end" fill="#e2e8f0">€4,410.25</text>
  </g>

  <!-- button -->
  <rect x="692" y="462" width="388" height="46" rx="12" fill="url(#accent)"/>
  <text x="886" y="492" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Refresh</text>
</svg>

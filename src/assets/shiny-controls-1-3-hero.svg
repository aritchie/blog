<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="wordBand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#185ABD"/>
      <stop offset="100%" stop-color="#2b6fd6"/>
    </linearGradient>
    <linearGradient id="excelBand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#107C41"/>
      <stop offset="100%" stop-color="#159c53"/>
    </linearGradient>
    <linearGradient id="pptBand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C43E1C"/>
      <stop offset="100%" stop-color="#e05127"/>
    </linearGradient>
    <radialGradient id="netGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="docClip"><rect x="688" y="96" width="290" height="420" rx="16"/></clipPath>
    <clipPath id="sheetClip"><rect x="742" y="150" width="290" height="420" rx="16"/></clipPath>
    <clipPath id="noteClip"><rect x="796" y="204" width="290" height="420" rx="16"/></clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="900" cy="300" rx="520" ry="420" fill="url(#netGlow)"/>

  <!-- faint token grid -->
  <g stroke="#334155" stroke-opacity="0.28" stroke-width="1">
    <path d="M0 150 H1200 M0 300 H1200 M0 450 H1200"/>
    <path d="M150 0 V630 M300 0 V630 M450 0 V630 M600 0 V630 M750 0 V630 M900 0 V630 M1050 0 V630"/>
  </g>

  <!-- ============ headline ============ -->
  <text x="72" y="196" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#22d3ee" letter-spacing="4.5">SHINY CONTROLS</text>

  <text x="72" y="300" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="96" font-weight="800" fill="#f8fafc">1.3</text>
  <text x="238" y="300" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#e2e8f0">Word, Excel</text>
  <text x="72" y="368" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#e2e8f0">&amp; PowerPoint</text>

  <rect x="72" y="400" width="132" height="5" rx="2.5" fill="url(#accentA)" filter="url(#glow)"/>

  <text x="72" y="458" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="27" font-weight="500" fill="#94a3b8">in your app. Free.</text>
  <text x="72" y="498" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#64748b">.NET MAUI &amp; Blazor · editors, viewers, a notebook · no WebViews</text>

  <!-- ============ back card: Word document ============ -->
  <g filter="url(#softGlow)">
    <rect x="688" y="96" width="290" height="420" rx="16" fill="url(#chrome)" stroke="#475569" stroke-width="1.5"/>
  </g>
  <g clip-path="url(#docClip)">
    <rect x="688" y="96" width="290" height="34" fill="url(#wordBand)"/>
    <rect x="704" y="108" width="34" height="9" rx="4.5" fill="#f8fafc" opacity="0.9"/>
    <rect x="748" y="108" width="30" height="9" rx="4.5" fill="#f8fafc" opacity="0.45"/>
    <rect x="788" y="108" width="36" height="9" rx="4.5" fill="#f8fafc" opacity="0.45"/>
    <!-- ribbon groups -->
    <rect x="688" y="130" width="290" height="56" fill="#0b1220"/>
    <g fill="#334155">
      <rect x="702" y="140" width="22" height="22" rx="5"/><rect x="730" y="140" width="22" height="22" rx="5"/>
      <rect x="758" y="140" width="22" height="22" rx="5"/>
      <rect x="798" y="140" width="22" height="22" rx="5"/><rect x="826" y="140" width="22" height="22" rx="5"/>
      <rect x="866" y="140" width="22" height="22" rx="5"/><rect x="894" y="140" width="22" height="22" rx="5"/>
      <rect x="922" y="140" width="22" height="22" rx="5"/>
    </g>
    <g fill="#475569">
      <rect x="702" y="170" width="58" height="5" rx="2.5"/>
      <rect x="798" y="170" width="50" height="5" rx="2.5"/>
      <rect x="866" y="170" width="56" height="5" rx="2.5"/>
    </g>
    <line x1="786" y1="138" x2="786" y2="180" stroke="#1e293b" stroke-width="1"/>
    <line x1="856" y1="138" x2="856" y2="180" stroke="#1e293b" stroke-width="1"/>
    <!-- page -->
    <rect x="716" y="202" width="234" height="300" rx="4" fill="#f8fafc"/>
    <g fill="#cbd5e1">
      <rect x="740" y="228" width="140" height="10" rx="4"/>
      <rect x="740" y="256" width="186" height="6" rx="3"/>
      <rect x="740" y="272" width="178" height="6" rx="3"/>
      <rect x="740" y="288" width="186" height="6" rx="3"/>
      <rect x="740" y="304" width="120" height="6" rx="3"/>
      <rect x="740" y="336" width="186" height="6" rx="3"/>
      <rect x="740" y="352" width="164" height="6" rx="3"/>
      <rect x="740" y="368" width="186" height="6" rx="3"/>
      <rect x="740" y="384" width="98" height="6" rx="3"/>
    </g>
    <!-- a find hit, washed amber, and the selected one -->
    <rect x="838" y="268" width="46" height="14" rx="3" fill="#fbbf24" opacity="0.55"/>
    <rect x="800" y="348" width="52" height="14" rx="3" fill="#185ABD" opacity="0.85"/>
    <!-- misspelling squiggle -->
    <path d="M740 398 q4 -4 8 0 t8 0 t8 0 t8 0 t8 0" stroke="#ef4444" stroke-width="2" fill="none"/>
  </g>

  <!-- ============ middle card: spreadsheet ============ -->
  <g filter="url(#softGlow)">
    <rect x="742" y="150" width="290" height="420" rx="16" fill="url(#chrome)" stroke="#475569" stroke-width="1.5"/>
  </g>
  <g clip-path="url(#sheetClip)">
    <rect x="742" y="150" width="290" height="34" fill="url(#excelBand)"/>
    <rect x="758" y="162" width="34" height="9" rx="4.5" fill="#f8fafc" opacity="0.9"/>
    <rect x="802" y="162" width="26" height="9" rx="4.5" fill="#f8fafc" opacity="0.45"/>
    <rect x="742" y="184" width="290" height="46" fill="#0b1220"/>
    <g fill="#334155">
      <rect x="756" y="194" width="20" height="20" rx="5"/><rect x="782" y="194" width="20" height="20" rx="5"/>
      <rect x="808" y="194" width="20" height="20" rx="5"/>
      <rect x="846" y="194" width="20" height="20" rx="5"/><rect x="872" y="194" width="20" height="20" rx="5"/>
      <rect x="910" y="194" width="20" height="20" rx="5"/><rect x="936" y="194" width="20" height="20" rx="5"/>
      <rect x="962" y="194" width="20" height="20" rx="5"/>
    </g>
    <!-- grid -->
    <rect x="756" y="248" width="262" height="290" fill="#f8fafc"/>
    <g stroke="#e2e8f0" stroke-width="1">
      <path d="M756 276 H1018 M756 304 H1018 M756 332 H1018 M756 360 H1018 M756 388 H1018 M756 416 H1018 M756 444 H1018 M756 472 H1018 M756 500 H1018"/>
      <path d="M812 248 V538 M868 248 V538 M924 248 V538 M980 248 V538"/>
    </g>
    <rect x="756" y="248" width="262" height="28" fill="#e2e8f0"/>
    <g fill="#94a3b8">
      <rect x="770" y="258" width="18" height="6" rx="3"/><rect x="826" y="258" width="18" height="6" rx="3"/>
      <rect x="882" y="258" width="18" height="6" rx="3"/><rect x="938" y="258" width="18" height="6" rx="3"/>
      <rect x="990" y="258" width="18" height="6" rx="3"/>
    </g>
    <g fill="#cbd5e1">
      <rect x="770" y="288" width="30" height="6" rx="3"/><rect x="826" y="288" width="30" height="6" rx="3"/>
      <rect x="882" y="288" width="24" height="6" rx="3"/>
      <rect x="770" y="316" width="30" height="6" rx="3"/><rect x="826" y="316" width="26" height="6" rx="3"/>
      <rect x="882" y="316" width="30" height="6" rx="3"/>
      <rect x="770" y="344" width="26" height="6" rx="3"/><rect x="826" y="344" width="30" height="6" rx="3"/>
    </g>
    <!-- marching ants over the copied range -->
    <rect x="812" y="276" width="112" height="84" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-dasharray="7 5"/>
    <!-- the live selection -->
    <rect x="924" y="388" width="56" height="28" fill="#107C41" fill-opacity="0.14" stroke="#107C41" stroke-width="2"/>
    <circle cx="980" cy="416" r="4" fill="#107C41"/>
  </g>

  <!-- ============ front card: notebook page with ink ============ -->
  <g filter="url(#softGlow)">
    <rect x="796" y="204" width="290" height="420" rx="16" fill="url(#chrome)" stroke="#475569" stroke-width="1.5"/>
  </g>
  <g clip-path="url(#noteClip)">
    <rect x="796" y="204" width="290" height="34" fill="url(#pptBand)"/>
    <rect x="812" y="216" width="34" height="9" rx="4.5" fill="#f8fafc" opacity="0.9"/>
    <rect x="856" y="216" width="30" height="9" rx="4.5" fill="#f8fafc" opacity="0.45"/>
    <rect x="896" y="216" width="26" height="9" rx="4.5" fill="#f8fafc" opacity="0.45"/>
    <!-- pen tools -->
    <rect x="796" y="238" width="290" height="42" fill="#0b1220"/>
    <g fill="#334155">
      <rect x="810" y="248" width="20" height="20" rx="5"/><rect x="836" y="248" width="20" height="20" rx="5"/>
      <rect x="862" y="248" width="20" height="20" rx="5"/>
    </g>
    <rect x="888" y="248" width="20" height="20" rx="5" fill="#22d3ee"/>
    <g fill="#334155">
      <rect x="926" y="248" width="20" height="20" rx="5"/><rect x="952" y="248" width="20" height="20" rx="5"/>
    </g>
    <!-- ruled page, no edges -->
    <rect x="796" y="280" width="290" height="344" fill="#f8fafc"/>
    <g stroke="#e8edf3" stroke-width="1.5">
      <path d="M812 316 H1070 M812 352 H1070 M812 388 H1070 M812 424 H1070 M812 460 H1070 M812 496 H1070 M812 532 H1070 M812 568 H1070"/>
    </g>
    <!-- typed line -->
    <g fill="#cbd5e1">
      <rect x="828" y="300" width="150" height="9" rx="4"/>
      <rect x="828" y="336" width="196" height="6" rx="3"/>
      <rect x="828" y="372" width="120" height="6" rx="3"/>
    </g>
    <!-- highlighter beneath the words -->
    <rect x="824" y="330" width="118" height="18" rx="3" fill="#fbbf24" opacity="0.35"/>
    <!-- handwriting -->
    <path d="M832 424 q16 -26 30 -2 t28 -4 q14 -22 30 2 t28 -6"
          stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M832 470 q22 -20 44 4 t46 -8 q16 20 40 -2"
          stroke="#185ABD" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <!-- a sketched shape, selected -->
    <rect x="960" y="440" width="98" height="72" rx="8" fill="none" stroke="#C43E1C" stroke-width="3"/>
    <g fill="#22d3ee">
      <circle cx="960" cy="440" r="4.5"/><circle cx="1058" cy="440" r="4.5"/>
      <circle cx="960" cy="512" r="4.5"/><circle cx="1058" cy="512" r="4.5"/>
    </g>
    <!-- lasso -->
    <path d="M818 540 q60 -26 120 -4 q34 14 6 32 q-70 22 -128 2 q-24 -12 2 -30 Z"
          fill="#8b5cf6" fill-opacity="0.08" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6 4"/>
  </g>
</svg>

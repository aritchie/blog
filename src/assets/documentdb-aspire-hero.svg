<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="accentViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.3" opacity="0.3"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#22d3ee"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <circle cx="230" cy="270" r="220" fill="#8b5cf6" opacity="0.06" filter="url(#softGlow)"/>
  <circle cx="980" cy="250" r="220" fill="#06b6d4" opacity="0.05" filter="url(#softGlow)"/>
  <circle cx="600" cy="430" r="200" fill="#34d399" opacity="0.03" filter="url(#softGlow)"/>

  <rect x="0" y="0" width="1200" height="3" fill="url(#accentCyan)"/>

  <!-- LEFT: AppHost picks the backend -->
  <g transform="translate(70, 96)">
    <rect width="150" height="24" rx="12" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1"/>
    <text x="75" y="16" text-anchor="middle" fill="#c4b5fd" font-family="monospace" font-size="11" font-weight="bold">APPHOST</text>
  </g>

  <g transform="translate(70, 140)">
    <rect width="380" height="220" rx="10" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.6"/>
    <text x="20" y="38" fill="#64748b" font-family="monospace" font-size="12">// the deployment decision</text>
    <text x="20" y="66" fill="#94a3b8" font-family="monospace" font-size="13">var store = builder</text>
    <text x="34" y="90" fill="#a78bfa" font-family="monospace" font-size="13">.AddPostgresDocumentStore(</text>
    <text x="34" y="110" fill="#fbbf24" font-family="monospace" font-size="13">    "orders"</text>
    <text x="34" y="130" fill="#94a3b8" font-family="monospace" font-size="13">  )</text>
    <text x="34" y="152" fill="#34d399" font-family="monospace" font-size="13">.WithSeeder(...);</text>

    <line x1="20" y1="170" x2="360" y2="170" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="196" fill="#64748b" font-family="monospace" font-size="12">// swap it — nobody downstream</text>
    <text x="20" y="212" fill="#64748b" font-family="monospace" font-size="12">// changes a line</text>
  </g>

  <!-- backend chips -->
  <g font-family="monospace" font-size="11" font-weight="bold">
    <g transform="translate(70, 378)"><rect width="86" height="26" rx="13" fill="#1e293b" stroke="#06b6d4" stroke-width="1.1"/><text x="43" y="18" text-anchor="middle" fill="#22d3ee">Postgres</text></g>
    <g transform="translate(166, 378)"><rect width="96" height="26" rx="13" fill="#1e293b" stroke="#a78bfa" stroke-width="1.1"/><text x="48" y="18" text-anchor="middle" fill="#c4b5fd">SQL Server</text></g>
    <g transform="translate(272, 378)"><rect width="70" height="26" rx="13" fill="#1e293b" stroke="#10b981" stroke-width="1.1"/><text x="35" y="18" text-anchor="middle" fill="#34d399">MySQL</text></g>
    <g transform="translate(352, 378)"><rect width="98" height="26" rx="13" fill="#1e293b" stroke="#f472b6" stroke-width="1.1"/><text x="49" y="18" text-anchor="middle" fill="#f472b6">CockroachDB</text></g>
    <g transform="translate(70, 414)"><rect width="78" height="26" rx="13" fill="#1e293b" stroke="#eab308" stroke-width="1.1"/><text x="39" y="18" text-anchor="middle" fill="#fbbf24">MariaDB</text></g>
    <g transform="translate(158, 414)"><rect width="70" height="26" rx="13" fill="#1e293b" stroke="#64748b" stroke-width="1.1"/><text x="35" y="18" text-anchor="middle" fill="#94a3b8">SQLite</text></g>
  </g>

  <!-- the wire contract -->
  <path d="M 462 226 C 520 226, 530 226, 588 226" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <g transform="translate(462, 240)">
    <text x="0" y="14" fill="#64748b" font-family="monospace" font-size="10">ConnectionStrings:orders</text>
    <text x="0" y="30" fill="#64748b" font-family="monospace" font-size="10">…:orders:Provider</text>
  </g>

  <!-- RIGHT: consumers -->
  <g transform="translate(600, 96)">
    <rect width="180" height="24" rx="12" fill="#1e1b4b" stroke="#22d3ee" stroke-width="1"/>
    <text x="90" y="16" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="11" font-weight="bold">EVERY CONSUMER</text>
  </g>

  <g transform="translate(600, 140)">
    <rect width="530" height="88" rx="10" fill="#0f172a" stroke="#06b6d4" stroke-width="1.6"/>
    <text x="20" y="34" fill="#64748b" font-family="monospace" font-size="12">// api / worker / silo — the same line</text>
    <text x="20" y="64" fill="#22d3ee" font-family="monospace" font-size="16" font-weight="bold">builder.AddDocumentStore("orders");</text>
  </g>

  <g transform="translate(600, 244)">
    <rect width="530" height="60" rx="10" fill="#0f172a" stroke="#a78bfa" stroke-width="1.4"/>
    <text x="20" y="26" fill="#64748b" font-family="monospace" font-size="12">// …and a whole Orleans silo</text>
    <text x="20" y="48" fill="#c4b5fd" font-family="monospace" font-size="14" font-weight="bold">silo.UseAspireDocumentDb("orleans");</text>
  </g>

  <!-- what comes free -->
  <g transform="translate(600, 322)" font-family="monospace" font-size="12" font-weight="bold">
    <g><rect width="150" height="30" rx="15" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/><text x="75" y="20" text-anchor="middle" fill="#34d399">health check</text></g>
    <g transform="translate(164, 0)"><rect width="180" height="30" rx="15" fill="#1e293b" stroke="#06b6d4" stroke-width="1.2"/><text x="90" y="20" text-anchor="middle" fill="#22d3ee">traces + metrics</text></g>
    <g transform="translate(358, 0)"><rect width="172" height="30" rx="15" fill="#1e293b" stroke="#f472b6" stroke-width="1.2"/><text x="86" y="20" text-anchor="middle" fill="#f472b6">keyed by name</text></g>
    <g transform="translate(0, 42)"><rect width="150" height="30" rx="15" fill="#1e293b" stroke="#eab308" stroke-width="1.2"/><text x="75" y="20" text-anchor="middle" fill="#fbbf24">seeding gate</text></g>
    <g transform="translate(164, 42)"><rect width="180" height="30" rx="15" fill="#1e293b" stroke="#a78bfa" stroke-width="1.2"/><text x="90" y="20" text-anchor="middle" fill="#c4b5fd">admin UI resource</text></g>
    <g transform="translate(358, 42)"><rect width="172" height="30" rx="15" fill="#1e293b" stroke="#64748b" stroke-width="1.2"/><text x="86" y="20" text-anchor="middle" fill="#94a3b8">terminal resource</text></g>
  </g>

  <text x="600" y="510" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="13">the backend stops being source code</text>

  <text x="600" y="562" text-anchor="middle" fill="#f8fafc" font-family="monospace" font-size="28" font-weight="bold" filter="url(#glow)">DocumentDb in .NET Aspire</text>
  <text x="600" y="592" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="13">Hosting · Client · Orleans</text>
</svg>
